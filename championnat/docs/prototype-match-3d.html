<title>Multiplex Match Maquette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Plein écran : la maquette en fond, le tableau d'affichage en haut, le fil du direct et les réglages en bas.
   Couleurs reprises du jeu (« Vestiaire de nuit ») pour les panneaux, la scène garde sa propre lumière. */
:root{
  --fond:#e9e1cf; --nuit:#0b1626; --tableau:#05080d; --bord:#1d2633; --clair:#f2f5fa; --dim:#8a97ab;
  --jaune:#ffd24a; --encre-jaune:#16243c;
  --led:"Silkscreen", "Courier New", monospace;
  --fil:"VT323", "Courier New", monospace;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--fond);color:var(--clair);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab;display:block}
#scene:active{cursor:grabbing}
.tableau{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  background:var(--tableau);font-family:var(--led);display:flex;align-items:center;gap:10px;
  padding:6px 12px;border:3px solid var(--bord);box-shadow:0 3px 0 #000;font-size:15px;white-space:nowrap;z-index:2;color:var(--clair)}
.tableau .eq{display:flex;align-items:center;gap:6px}
.tableau .pastille{width:10px;height:10px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.tableau .score{color:var(--jaune);padding:0 4px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 2px currentColor, 0 1px 0 rgba(0,0,0,.6)}
.tableau .min{color:var(--jaune);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.banniere{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);font-family:var(--led);font-weight:700;text-align:center;
  color:var(--jaune);text-shadow:4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  opacity:0;pointer-events:none;transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);z-index:3;white-space:nowrap}
.banniere .gros{display:block;font-size:clamp(40px,11vw,96px);line-height:1}
.banniere .nom{display:block;font-size:clamp(14px,3.6vw,24px);color:var(--clair);margin-top:6px}
.banniere.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bas{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));pointer-events:none}
.fil{pointer-events:auto;width:min(640px,100%);background:rgba(11,22,38,.9);border:3px solid var(--bord);box-shadow:0 3px 0 #000;
  font-family:var(--fil);font-size:20px;line-height:1.05;padding:6px 10px;display:flex;flex-direction:column;gap:4px;min-height:3.6em}
.fil p{margin:0;display:flex;gap:8px;min-width:0}
.fil p + p{opacity:.45}
.fil .m{color:var(--jaune);flex:none;font-variant-numeric:tabular-nums}
.fil .tx{min-width:0;overflow-wrap:anywhere}
.fil .but{color:var(--jaune)}
.fil .sys{color:var(--dim)}
.fil .amb{color:#c4ccd8}
.reglages{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:none}
.groupe{display:flex;pointer-events:auto;background:var(--nuit);border:3px solid var(--bord);box-shadow:0 3px 0 #000}
.groupe button{font-family:var(--led);font-size:12px;color:var(--clair);background:transparent;border:0;padding:8px 10px;cursor:pointer;letter-spacing:.04em;min-height:36px}
.groupe button + button{border-left:2px solid rgba(242,245,250,.18)}
.groupe button[aria-pressed="true"]{background:var(--clair);color:var(--nuit)}
.groupe button:focus-visible{outline:2px solid var(--jaune);outline-offset:-4px}
@media (max-width:520px){.groupe button{font-size:11px;padding:7px 8px}.tableau{font-size:13px}.fil{font-size:18px}}
</style>

<canvas id="scene" aria-label="Maquette 3D du match en direct"></canvas>

<div class="tableau" aria-live="off">
  <span class="eq"><span class="pastille" id="pDom"></span><span id="cDom">DOM</span></span>
  <span class="score" id="score">0 - 0</span>
  <span class="eq"><span id="cExt">EXT</span><span class="pastille" id="pExt"></span></span>
  <span class="min" id="minute">00'</span>
</div>
<div class="banniere" id="banniere"><span class="gros" id="banGros">BUT !</span><span class="nom" id="banNom"></span></div>

<div class="bas">
  <div class="fil" id="fil" aria-live="polite"></div>
  <div class="reglages">
    <div class="groupe" id="gMatch" aria-label="Match"></div>
    <div class="groupe" id="gVitesse" aria-label="Vitesse">
      <button id="v-pause" data-v="0">Pause</button>
      <button id="v-normale" data-v="2300" aria-pressed="true">Normale</button>
      <button id="v-rapide" data-v="950">Rapide</button>
    </div>
    <div class="groupe" id="gCamera" aria-label="Caméra">
      <button id="c-large" data-v="large">Large</button>
      <button id="c-ballon" data-v="ballon">Ballon</button>
    </div>
  </div>
</div>

function texturePelouse(neige=0, boue=0){
  const ppm=4, W=(L+10)*ppm, H=(Lg+10)*ppm, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  for(let i=0;i<14;i++){ x.fillStyle = i%2 ? '#5aa143' : '#4e9439'; x.fillRect(i*W/14,0,W/14+1,H); }
  for(let i=0;i<W*H/14;i++){ x.fillStyle = Math.random()<.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.05)'; x.fillRect((Math.random()*W)|0,(Math.random()*H)|0,1,1); }
  if(boue>0){ // les surfaces et le rond central se creusent
    x.fillStyle=`rgba(110,80,45,${boue})`;
    for(const [cx,cy,r] of [[5*ppm+8*ppm,H/2,10*ppm],[W-5*ppm-8*ppm,H/2,10*ppm],[W/2,H/2,8*ppm]]){ x.beginPath(); x.ellipse(cx,cy,r,r*1.3,0,0,Math.PI*2); x.fill(); }
  }
  if(neige>0){ x.fillStyle=`rgba(240,244,248,${neige})`; x.fillRect(0,0,W,H); }
  x.strokeStyle = neige>0.5 ? '#c9d3dc' : '#f2f2ea'; x.lineWidth=2; x.fillStyle=x.strokeStyle;
  const o=5*ppm, P=v=>v*ppm;
  x.strokeRect(o,o,P(L),P(Lg));
  x.beginPath(); x.moveTo(o+P(L/2),o); x.lineTo(o+P(L/2),o+P(Lg)); x.stroke();
  x.beginPath(); x.arc(o+P(L/2),o+P(Lg/2),P(9.15),0,Math.PI*2); x.stroke();
  for(const s of [0,1]){
    x.strokeRect(s? o+P(L)-P(16.5) : o, o+P(Lg/2-20.16), P(16.5), P(40.32));
    x.strokeRect(s? o+P(L)-P(5.5): o, o+P(Lg/2-9.16), P(5.5), P(18.32));
    const sx = s? o+P(L-11): o+P(11);
    x.fillRect(sx-2,o+P(Lg/2)-2,4,4);
    x.beginPath(); x.arc(sx,o+P(Lg/2),P(9.15), s? Math.PI*0.7:-Math.PI*0.3, s? Math.PI*1.3:Math.PI*0.3); x.stroke();
  }
  x.fillRect(o+P(L/2)-2,o+P(Lg/2)-2,4,4);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps=false; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function tribune(cx, cz, longueur, rangs, orient){
  const g = new THREE.Group(); g.position.set(cx,0,cz); scene.add(g);
  const surX = Math.abs(orient[0])>0;
  for(let r=0;r<rangs;r++){
    const h = 1.2*(r+1), recul = r*2.2;
    const ox = surX? -orient[0]*recul : 0, oz = surX? 0 : -orient[1]*recul;
    box(surX?2.2:longueur, h, surX?longueur:2.2, r%2?beton:betonClair, ox, h/2, oz, g);
    const n = Math.floor(longueur/1.35);
    for(let i=0;i<n;i++){
      if(rnd()<.12) continue;
      const t = -longueur/2 + .7 + i*1.35;
      places.push({ x: cx+ox+(surX?0:t), y: h+.75, z: cz+oz+(surX?t:0), ph: rnd()*6.28, k: .6+rnd()*.8, camp: 0 });
    }
  }
}

/* ================================================================================================
   LES JOUEURS : les onze de la feuille de match, en petites figurines
   ================================================================================================ */
const PEAU = [0xf0c8a0,0xd9a77a,0x8d5a3b,0xc48b5e,0x5a3a26];
const CHEVEUX = [0x2b1d12,0x6b4423,0xd8b46a,0x111111,0x8a5a2b];
const ECHELLE = 2.3;
let joueurs = [], gardiens = {};
const SENS = {dom:1, ext:-1};      // le sens d'attaque de chaque camp (+1 = vers les x positifs) ; il change à la mi-temps
const adverse = c => c==='dom'?'ext':'dom';

function hexInt(h){ return parseInt(h.slice(1),16); }
function distanceCouleur(u,v){ const q=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const a=q(u), b=q(v); return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]); }
function tenues(md){
  const dom=[md.dom.couleurs.a, md.dom.couleurs.b];
  let ext=[md.ext.couleurs.a, md.ext.couleurs.b];
  if(distanceCouleur(dom[0],ext[0])<120) ext=[ext[1],ext[0]];       // comme au jeu : le visiteur inverse s'il ressemble trop
  const choixGK=['#2f8f5a','#e07b2a','#6a6a6a','#7a3fa0','#111111','#3ab0c8'].sort((a,b)=>
    Math.min(distanceCouleur(b,dom[0]),distanceCouleur(b,ext[0]))-Math.min(distanceCouleur(a,dom[0]),distanceCouleur(a,ext[0])));
  return { dom:{maillot:dom[0], short:dom[1], gk:choixGK[0]}, ext:{maillot:ext[0], short:ext[1], gk:choixGK[1]} };
}
function figurine(tenue, gardien){
  const g = new THREE.Group(); g.scale.setScalar(ECHELLE);
  const peau = M(PEAU[(rnd()*PEAU.length)|0]);
  const maillot = M(hexInt(gardien?tenue.gk:tenue.maillot)), short = M(hexInt(gardien?'#1a1a1a':tenue.short));
  const jambeG = new THREE.Group(), jambeD = new THREE.Group();
  jambeG.position.set(-.18,.85,0); jambeD.position.set(.18,.85,0);
  box(.24,.5,.24,peau,0,-.3,0,jambeG); box(.26,.32,.26,maillot,0,-.68,0,jambeG);
  box(.24,.5,.24,peau,0,-.3,0,jambeD); box(.26,.32,.26,maillot,0,-.68,0,jambeD);
  g.add(jambeG,jambeD);
  box(.66,.34,.4,short,0,.92,0,g);
  box(.72,.7,.42,maillot,0,1.42,0,g);
  const brasG=box(.2,.62,.22,maillot,-.48,1.4,0,g), brasD=box(.2,.62,.22,maillot,.48,1.4,0,g);
  box(.44,.44,.44,peau,0,2.02,0,g);
  box(.48,.16,.48,M(CHEVEUX[(rnd()*CHEVEUX.length)|0]),0,2.28,-.02,g);
  scene.add(g);
  return {g, jambeG, jambeD, brasG, brasD};
}
/* la formation se lit dans le onze lui-même : autant de lignes que de postes, réparties sur la largeur */
function placesFormation(xi){
  const X={G:-.93, D:-.6, M:-.25, A:.12}, par={G:[],D:[],M:[],A:[]};
  xi.forEach((p,i)=>par[p.pos in par?p.pos:'M'].push(i));
  const out=[];
  for(const k of ['G','D','M','A']){
    const n=par[k].length, larg = n>=5?.74:n===4?.64:n===3?.5:n===2?.22:0;
    par[k].forEach((idx,i)=>{ const z = n===1?0 : -larg + 2*larg*i/(n-1); const creux = (k==='M'&&n>=4&&(i===0||i===n-1))?.06:0; out[idx]={x:X[k]+creux, z}; });
  }
  return out;
}
function creerJoueurs(md){
  for(const j of joueurs){ scene.remove(j.g); if(j.lab) scene.remove(j.lab); if(j.crt) scene.remove(j.crt); }
  joueurs=[]; gardiens={};
  const T=tenues(md);
  for(const camp of ['dom','ext']){
    const xi=md[camp].xi, pl=placesFormation(xi);
    xi.forEach((p,i)=>{
      const f=figurine(T[camp], p.pos==='G');
      const j={...f, camp, nom:p.nom, poste:p.pos, gardien:p.pos==='G', base:pl[i], pos:new THREE.Vector3(), vel:new THREE.Vector3(), cible:new THREE.Vector3(), phase:rnd()*6.28, num:i, dehors:false, tombe:0, lab:null, crt:null, labT:0, crtT:0};
      joueurs.push(j); if(j.gardien) gardiens[camp]=j;
    });
  }
  return T;
}
const equipe = c => joueurs.filter(j=>j.camp===c && !j.dehors);
const sens = j => SENS[j.camp];

function plusProche(liste, p, sauf){ let m=null,d=1e9; for(const j of liste){ if(j===sauf) continue; const e=j.pos.distanceTo(p); if(e<d){d=e;m=j;} } return [m,d]; }

/* la place de chacun au coup d'envoi : chacun dans sa moitié, les deux qui engagent au rond central */
function postesEnvoi(campQuiEngage){
  const P=new Map();
  for(const j of joueurs){ if(j.dehors) continue; const s=sens(j); let x = j.gardien ? -s*(L/2-3) : j.base.x*48*.55*s; if(x*s>-1.5) x=-1.5*s; P.set(j,new THREE.Vector3(x,0,j.gardien?0:j.base.z*30*s)); }
  const eq=equipe(campQuiEngage).filter(j=>!j.gardien).sort((a,b)=>b.base.x-a.base.x), s=SENS[campQuiEngage];
  if(eq[0]) P.set(eq[0],new THREE.Vector3(-s*1.2,0,0));
  if(eq[1]) P.set(eq[1],new THREE.Vector3(-s*3.5,0,s*5));
  for(const j of equipe(adverse(campQuiEngage))) if(!j.gardien){ const p=P.get(j); if(Math.hypot(p.x,p.z)<10.5){ p.multiplyScalar(10.5/Math.max(1,Math.hypot(p.x,p.z))); } }
  return {P, eng:eq[0], second:eq[1]};
}
function placerCoupEnvoi(campQuiEngage){
  const {P, eng}=postesEnvoi(campQuiEngage);
  for(const [j,p] of P){ j.pos.copy(p); j.vel.set(0,0,0); j.tombe=0; }
  B.pos.set(0,.62,0); B.porteur=eng; B.vol=null; B.filet=null; B.libre=null;
  etat.decision=alea(.6,1.2); etat.corner=null;
}

/* ================================================================================================
   LE JEU D'ATTENTE : entre deux lignes du direct, les équipes se passent le ballon sans jamais
   tirer. Les tirs, les buts, les cartons ne viennent QUE des lignes du moteur.
   ================================================================================================ */
function passe(de, vers, lob=false){
  const dep=de.pos.clone(); dep.y=.62;
  const arr=vers.pos.clone().addScaledVector(vers.vel,.6); arr.y=.62;
  arr.x=clamp(arr.x,-L/2+2,L/2-2); arr.z=clamp(arr.z,-Lg/2+1,Lg/2-1);
  const dist=dep.distanceTo(arr);
  const adv=equipe(adverse(de.camp)); const seg=new THREE.Line3(dep,arr); let coupeur=null, pt=null;
  for(const a of adv){ if(a.gardien) continue; const q=new THREE.Vector3(); seg.closestPointToPoint(a.pos,true,q); if(a.pos.distanceTo(q)<3 && Math.random()<.4){ coupeur=a; pt=q; break; } }
  B.porteur=null;
  if(coupeur) B.vol={de:dep, a:pt, t:0, d:Math.max(.25,dep.distanceTo(pt)/24), haut:.6, recepteur:coupeur};
  else B.vol={de:dep, a:arr, t:0, d:Math.max(.3,dist/(lob?20:25)), haut: lob||dist>32 ? Math.min(9,dist*.18) : .5, recepteur:vers};
}
function decider(p){
  const s=sens(p), coeq=equipe(p.camp).filter(j=>j!==p && !j.gardien), adv=equipe(adverse(p.camp));
  const avance=p.pos.x*s, haut=avance>L/2-28;   // trop près du but : on ressort le ballon, le tir n'appartient qu'au moteur
  let meilleur=null, note=-1e9;
  for(const c of coeq){
    const d=c.pos.distanceTo(p.pos); if(d<6||d>46) continue;
    const [,marquage]=plusProche(adv,c.pos);
    const gain=(c.pos.x-p.pos.x)*s;
    const n=(haut? -Math.abs(gain-(-8))*.6 : gain*.8) + Math.min(marquage,10)*1.2 - d*.08 + alea(0,12);
    if(n>note){note=n;meilleur=c;}
  }
  if(meilleur) passe(p,meilleur);
  etat.decision=alea(.7,1.8);
}

/* ================================================================================================
   LES ACTIONS : chaque ligne d'occasion, de but ou de carton du moteur devient une petite scène.
   Elle démarre quand la ligne PRÉCÉDENTE s'affiche, et le ballon arrive au but, dans les gants ou
   à côté au moment exact où la ligne tombe au fil. Une action se décrit dans le repère de l'attaque :
   ax = distance vers le but adverse (le but est à +52,5), z = la largeur.
   ================================================================================================ */
let ACT=null;
const CODE_FIN=/\(([A-Z]{2,4})\)\s*$/;
function trouveNom(texte, liste){ let best=null; for(const j of liste){ if(texte.includes(j.nom) && (!best || j.nom.length>best.nom.length)) best=j; } return best; }
function campDe(code){ const md=etat.md; return code===md.dom.id?'dom':code===md.ext.id?'ext':null; }
function lireLigne(l){
  const x=l.x||'', md=etat.md;
  let code = (l.g&&l.g.cote)||(l.q&&l.q.cote)||(l.c&&l.c.cote)||((CODE_FIN.exec(x)||[])[1]);
  let camp = code?campDe(code):null;
  if(!camp){ const j=trouveNom(x, joueurs); if(j) camp=j.camp; }
  let genre=null;
  if(l.c) genre='carton';
  else if(l.ca) genre='corner-annonce';
  else if(/hors-jeu|drapeau (du juge de touche )?(se l[eè]ve|est lev)|juge de touche/i.test(x)) genre='horsjeu';
  else if(l.t==='but') genre='but';
  else if(l.t==='occ' && (l.ic==='arret'||l.ic==='rate')){
    if(/POTEAU|BARRE|transversale|montant|poteau|sur la barre|le bois/i.test(x)) genre='poteau';
    else if(l.ic==='rate' && /intercept|le perd|perd le ballon|bien lu|coupe la trajectoire|repris par la défense|contré|dégagé/i.test(x)) genre='perdu';
    else if(l.ic==='arret' || /gants|capte|s'empare|bloque|claque|détourne|sauve|parade/i.test(x)) genre='arret';
    else genre='rate';
  }
  if(!genre || !camp) return null;
  const ph=(l.g&&l.g.ph)||(l.q&&l.q.ph)||'';
  let voie='combi';
  if(l.g&&l.g.pen || /penalty|point de penalty|onze mètres/i.test(x)) voie='pen';
  else if(ph==='cf' || (l.g&&l.g.cf) || /coup franc|pose le ballon à|le mur/i.test(x)) voie='cf';
  else if(/corner/i.test(x)) voie='corner';
  else if(ph==='loin' || /trente mètres|vingt-cinq mètres|de loin|lointaine|mine|obus|praline|frappe sèche de/i.test(x)) voie='loin';
  else if(ph==='aile') voie='aile';
  else if(ph==='centre' || /centre|de la tête|tête plongeante/i.test(x)) voie='centre';
  else if(ph==='lob' || /lob/i.test(x)) voie='lob';
  else if(ph==='face' || ph==='drib' || /seul face|face-à-face|percée|déboule|slalom/i.test(x)) voie='face';
  const att = genre==='carton' ? adverse(camp) : camp;       // le carton : l'action est celle de l'équipe qui subit la faute
  const nomTireur=(l.g&&l.g.but)||(l.q&&l.q.but)||(l.c&&l.c.nom)||null;
  return {genre, voie, camp, att, def:adverse(att), nomTireur, nomPasseur:(l.g&&l.g.pas)||null, rouge:!!(l.c&&l.c.rouge), ligne:l};
}

function lanceAction(info, T){
  ACT=null;
  if(etat.phase==='but'){ placerCoupEnvoi(adverse(etat.buteur.camp)); etat.phase='jeu'; }
  if(etat.phase==='pause' || etat.phase==='fin' || etat.phase==='avant') return;
  const s=SENS[info.att], att=equipe(info.att), def=equipe(info.def);
  const gk=gardiens[info.def] && !gardiens[info.def].dehors ? gardiens[info.def] : null;
  const champ=att.filter(j=>!j.gardien);
  const parNom=n=>n?champ.find(j=>j.nom===n)||trouveNom(n, champ):null;
  const fautif = info.genre==='carton' ? (joueurs.find(j=>j.camp===info.camp && j.nom===info.nomTireur && !j.dehors) || equipe(info.camp).find(j=>!j.gardien)) : null;
  let A = info.genre==='carton' ? null : (parNom(info.nomTireur) || trouveNom(info.ligne.x||'', champ));
  if(!A) A = champ.filter(j=>j.poste==='A')[0] || champ[champ.length-1];
  const P0 = B.pos.clone();                                         // l'action part de là où est le ballon
  let porteur = B.porteur && B.porteur.camp===info.att && !B.porteur.gardien ? B.porteur : plusProche(champ, P0, A)[0] || A;
  const P = parNom(info.nomPasseur) && parNom(info.nomPasseur)!==A ? parNom(info.nomPasseur) : porteur;
  const autres = champ.filter(j=>j!==A && j!==P);
  const side = Math.sign(P0.z*s) || signe();
  const K=new Map(), S=[];
  const key=(j,u,ax,z)=>{ if(!j) return; if(!K.has(j)) K.set(j,[]); K.get(j).push({u, x:s*ax, z:s*z}); };
  const pied=(u0,u1,j)=>S.push({u0,u1,j});
  const vol=(u0,u1,ax,z,y,haut)=>S.push({u0,u1,a:new THREE.Vector3(s*ax,y,s*z),haut});
  const ax0 = clamp(P0.x*s, -40, 30), z0 = clamp(P0.z*s, -28, 28);
  let uTir=.8, depart=null;                                        // depart : d'où part le tir, dans le repère de l'attaque
  const v=info.voie;

  if(info.genre==='carton'){
    const V = plusProche(champ, fautif.pos)[0] || porteur;
    const vx=clamp(ax0+4,-35,38), vz=clamp(z0,-26,26);
    key(V,.15,vx,vz); pied(0,.7,V); key(V,.7,vx+9,vz+2*side);
    key(fautif,.4,vx+4,vz+side*6); key(fautif,.7,vx+8.6,vz+2*side+.4);
    S.push({u0:.7,u1:1,a:new THREE.Vector3(s*(vx+11),.62,s*(vz+3*side)),haut:.3});
    ACT={info,s,K,S,T,u:0,uTir:2,gk:null,A:V,fautif,victime:V};
  }
  else if(info.genre==='corner-annonce'){
    const W = A;
    key(P,.12,clamp(ax0+3,-30,30),z0); pied(0,.25,P);
    vol(.25,.45,34,side*29,.62,1.2); key(W,.45,34,side*29);
    pied(.45,.78,W); key(W,.78,48,side*30);
    const D=plusProche(def.filter(j=>!j.gardien), new THREE.Vector3(s*49,0,s*side*28))[0]; key(D,.78,49.5,side*27);
    vol(.78,1,L/2+3,side*30,.62,2);
    ACT={info,s,K,S,T,u:0,uTir:2,gk:null,A:W,side};
  }
  else if(v==='cf'){
    const bx=clamp(28+alea(-3,4),20,33), bz=alea(-12,12)*(Math.random()<.5?1:-1);
    depart={ax:bx,z:bz,y:.62};
    key(A,.3,bx-2.6,bz-.8); key(A,.72,bx-2.6,bz-.8); key(A,.79,bx-.3,bz);
    S.push({u0:0,u1:.3,a:new THREE.Vector3(s*bx,.62,s*bz),haut:.8});
    const vise=new THREE.Vector2(L/2-bx, -bz).normalize();
    def.filter(j=>!j.gardien).slice(1,5).forEach((d,i)=>{ const wx=bx+vise.x*9.15, wz=bz+vise.y*9.15+(i-1.5)*1.1; key(d,.3,wx,wz); key(d,.8,wx,wz); });
    uTir=.79;
  }
  else if(v==='pen'){
    depart={ax:L/2-11,z:0,y:.62};
    S.push({u0:0,u1:.35,a:new THREE.Vector3(s*(L/2-11),.62,0),haut:.6});
    key(A,.4,L/2-14,-1); key(A,.72,L/2-14,-1); key(A,.8,L/2-11.4,0);
    for(const j of [...autres, ...def.filter(d=>!d.gardien)]) { const p=j.pos.clone(); const ax=Math.min(p.x*s, L/2-19); key(j,.4,ax,p.z*s); key(j,1,ax,p.z*s); }
    uTir=.8;
  }
  else if(v==='corner' || etat.corner){
    const c=etat.corner || {side, tireur:P};
    const T2=c.tireur && !c.tireur.dehors && c.tireur.camp===info.att ? c.tireur : P;
    if(A===T2) A = autres.find(j=>j!==T2 && j.poste==='A') || autres.find(j=>j!==T2) || A;
    const autresC = autres.filter(j=>j!==T2 && j!==A);
    const fx=L/2-.6, fz=c.side*(Lg/2-.6);
    key(T2,0.02,fx-.8,fz-c.side*.6); key(T2,.22,fx-.8,fz-c.side*.6);
    S.push({u0:0,u1:.22,a:new THREE.Vector3(s*fx,.62,s*fz),haut:.2});
    const cible={ax:L/2-7.5, z:-c.side*1.2};
    key(A,.25,cible.ax-6,cible.z+c.side*5); key(A,.62,cible.ax,cible.z);
    vol(.25,.62,cible.ax,cible.z,2.6,4.5);
    autresC.slice(0,3).forEach((j,i)=>{ key(j,.4,L/2-10-i*2.5,(i-1)*5); key(j,1,L/2-10-i*2.5,(i-1)*5); });
    def.filter(d=>!d.gardien).slice(0,4).forEach((d,i)=>{ key(d,.4,L/2-6-i*1.5,(i-1.5)*3.4); key(d,1,L/2-6.5-i*1.5,(i-1.5)*3.4); });
    depart={ax:cible.ax,z:cible.z,y:2.4}; uTir=.74;
    S.push({u0:.62,u1:.74,a:new THREE.Vector3(s*cible.ax,2.4,s*cible.z),haut:0});
  }
  else if(v==='centre' || v==='aile'){
    const W = v==='aile' ? A : (P!==A?P:autres[0]);
    const tete = v==='aile' ? (plusProche(def.filter(j=>!j.gardien), new THREE.Vector3(s*(L/2-8),0,0))[0]) : A;
    const C = v==='aile' ? (autres.find(j=>j.poste==='A')||autres[0]) : null;
    key(porteur,.12,clamp(ax0+4,-30,28),z0); pied(0,.2,porteur);
    vol(.2,.36,30,side*29,.62,1.5); key(W,.36,30,side*29);
    pied(.36,.6,W); key(W,.6,46,side*30);
    const cx=L/2-8, cz=-side*1.5;
    vol(.6,.8,cx,cz,2.2,4);
    key(tete,.45,cx-9,cz-side*6); key(tete,.8,cx,cz);
    if(C){ key(C,.5,cx-8,cz+side*3); key(C,.8,cx-1.5,cz+side*2.5); }
    depart={ax:cx,z:cz,y:2.2}; uTir=.8;
  }
  else if(v==='loin'){
    const az=clamp(z0*.5,-14,14);
    key(porteur,.15,clamp(ax0+4,-30,20),z0); pied(0,.28,porteur);
    vol(.28,.46,20,az,.62,1); key(A,.46,20,az);
    pied(.46,.72,A); key(A,.72,25.5,az*.8);
    depart={ax:26.5,z:az*.8,y:.62}; uTir=.72;
  }
  else if(v==='face' || v==='lob' || info.genre==='horsjeu' || info.genre==='perdu'){
    const az=alea(-10,10);
    key(porteur,.12,clamp(ax0+5,-30,24),z0); pied(0,.22,porteur);
    vol(.22,.42,36,az,.62,v==='lob'?3:1); key(A,.3,30,az+side*2); key(A,.42,36,az);
    pied(.42,.8,A); key(A,.8,45,az*.35);
    depart={ax:46,z:az*.35,y:.62}; uTir=.8;
    if(gk) { key(gk,.55,L/2-1.8,0); key(gk,.8,L/2-(v==='lob'?7:4.5),az*.25); }
    if(info.genre==='horsjeu' || info.genre==='perdu'){
      S.push({u0:.8,u1:1,a:new THREE.Vector3(s*47,.62,s*az*.3),haut:.2});
      const D=plusProche(def.filter(j=>!j.gardien), new THREE.Vector3(s*44,0,s*az*.4))[0]; if(D && info.genre==='perdu') key(D,.95,46,az*.35);
      ACT={info,s,K,S,T,u:0,uTir:2,gk:null,A};
    }
  }
  else { // combinaison à une touche de balle
    const M2=autres[0]||P, az=alea(-8,8);
    key(porteur,.12,clamp(ax0+5,-30,24),z0); pied(0,.22,porteur);
    vol(.22,.38,28,-side*9,.62,.6); key(M2,.38,28,-side*9);
    pied(.38,.5,M2); key(M2,.5,32,-side*7);
    vol(.5,.66,40,az,.62,.6); key(A,.4,35,az+side*4); key(A,.66,40,az);
    pied(.66,.8,A); key(A,.8,43,az*.7);
    depart={ax:44,z:az*.7,y:.62}; uTir=.8;
  }

  if(!ACT || ACT.info!==info){
    /* le tir et son issue */
    const g=info.genre; let tz, ty, ax=L/2;
    if(g==='but'){ tz=alea(1,BUT_L/2-1.4)*signe(); ty=alea(.5,BUT_H-1.4); }
    else if(g==='arret'){ tz=alea(-4,4); ty=alea(.5,2.6); }
    else if(g==='poteau'){ if(Math.random()<.5){ tz=signe()*BUT_L/2; ty=alea(1,3.5); } else { tz=alea(-4,4); ty=BUT_H; } }
    else { if(Math.random()<.65){ tz=signe()*alea(BUT_L/2+1.5,BUT_L/2+6); ty=alea(.5,3); } else { tz=alea(-4,4); ty=alea(6,8); } ax=L/2+1; }
    const hauteur = v==='cf'?4.6 : v==='lob'?6 : v==='loin'?2.2 : .8;
    S.push({u0:uTir,u1:1,a:new THREE.Vector3(s*ax,ty,s*tz),haut:hauteur});
    let dir=0;
    if(gk){
      const z0g=clamp(depart?depart.z*.25:0,-3,3);
      const plonge = g==='arret' ? tz : g==='but' ? clamp(tz - Math.sign(tz||1)*alea(3,6),-6,6) : clamp(tz*.6,-5,5);
      if(!K.has(gk)) key(gk, Math.max(uTir-.1,.3), L/2-1.8, z0g);
      key(gk, 1, L/2-1.8, plonge);
      dir = Math.sign(s*(plonge-z0g)) || 1;                       // le côté du plongeon, dans le repère du monde
    }
    ACT={info,s,K,S,T,u:0,uTir,gk,A,tz,ty,but:g==='but',dir};
  }
  /* chaque acteur part de là où il est */
  for(const [j,ks] of K){ ks.sort((a,b)=>a.u-b.u); ks.unshift({u:0,x:j.pos.x,z:j.pos.z}); j.tombe=0; }
  B.porteur=null; B.vol=null; B.filet=null; B.libre=null;
  if(ACT.A && info.genre!=='carton') montrerNom(ACT.A, ACT.T+1.6);
  etat.corner=null;
}

function montrerNom(j, duree){ if(!j) return; if(!j.lab) j.lab=etiquette(j.nom.toUpperCase()); j.labT=duree; }

function avanceAction(dt){
  const a=ACT; a.u=Math.min(1, a.u + dt/a.T);
  for(const [j,ks] of a.K){
    let k=0; while(k<ks.length-2 && ks[k+1].u<a.u) k++;
    const p=ks[k], q=ks[Math.min(k+1,ks.length-1)];
    const f = q.u>p.u ? clamp((a.u-p.u)/(q.u-p.u),0,1) : 1;
    const nx=p.x+(q.x-p.x)*f, nz=p.z+(q.z-p.z)*f;
    if(dt>0){ j.vel.set((nx-j.pos.x)/dt,0,(nz-j.pos.z)/dt); if(j.vel.length()>16) j.vel.setLength(16); }
    j.pos.set(nx,0,nz);
  }
  const seg=a.S.find(s=>a.u>=s.u0 && a.u<=s.u1) || a.S[a.S.length-1];
  if(seg){
    if(seg.j){ const p=seg.j, dir=p.vel.lengthSq()>.1?p.vel.clone().normalize():new THREE.Vector3(a.s,0,0); B.pos.set(p.pos.x+dir.x*1.3,.62,p.pos.z+dir.z*1.3); }
    else { if(!seg.de) seg.de=B.pos.clone(); const f=clamp((a.u-seg.u0)/Math.max(1e-6,seg.u1-seg.u0),0,1);
      B.pos.lerpVectors(seg.de, seg.a, f); B.pos.y = seg.de.y+(seg.a.y-seg.de.y)*f + Math.sin(f*Math.PI)*seg.haut; }
  }
  if(a.gk && a.dir && a.u>a.uTir+(1-a.uTir)*.35) a.gk.plongeF = clamp((a.u-a.uTir)/(1-a.uTir),0,1)*a.dir;
  if(a.u>=1) issue();
}

function issue(){
  const a=ACT, info=a.info, s=a.s; ACT=null;
  if(a.gk) a.gk.plongeReste=.8;
  const g=info.genre;
  if(g==='carton'){
    a.victime.tombe=1.6;
    const f=a.fautif; if(!f.crt) f.crt=carton(info.rouge); f.crtT=2.8; montrerNom(f,2.8);
    if(info.rouge){ f.sortie=true; }
    const repr=plusProche(equipe(info.att).filter(j=>j!==a.victime && !j.gardien), B.pos)[0];
    B.porteur=repr||a.victime; etat.decision=1.4; return;
  }
  if(g==='corner-annonce'){
    const tireur=trouveNom(info.ligne.x||'', equipe(info.att)) || a.A;
    etat.corner={side:a.side, tireur};
    B.libre={t:0, d:.5, de:B.pos.clone(), a:new THREE.Vector3(s*(L/2-.6),.62,s*a.side*(Lg/2-.6))};
    return;
  }
  if(g==='horsjeu' || g==='perdu'){
    if(g==='horsjeu') banniere('HORS-JEU','',1400);
    const d=plusProche(equipe(info.def).filter(j=>!j.gardien), B.pos)[0]; B.porteur=d; etat.decision=1.2; return;
  }
  if(g==='but'){
    B.filet={s, t:0, a:B.pos.clone()};
    etat.phase='but'; etat.buteur=a.A; etat.celebration=0;
    montrerNom(a.A, 4);
    return;
  }
  if(g==='arret'){
    const gk=a.gk; if(gk){ B.porteur=gk; gk.tient=1.1; etat.decision=1.1; } return;
  }
  if(g==='poteau'){
    B.libre={t:0, d:.55, de:B.pos.clone(), a:new THREE.Vector3(s*(L/2-12), .62, s*alea(-10,10)), haut:2, ensuite:'def', camp:info.def};
    return;
  }
  // à côté ou au-dessus : le ballon file derrière la ligne, puis six mètres
  const sortie=B.pos.clone(); sortie.x=s*(L/2+5); sortie.y=.62;
  B.libre={t:0, d:.45, de:B.pos.clone(), a:sortie, haut:.6, ensuite:'six', camp:info.def};
}

/* ================================================================================================
   LE FIL DU DIRECT : une ligne toutes les 2,3 secondes, comme au jeu (vitesse « Normale »)
   ================================================================================================ */
const TK={ i:-1, horloge:0, prochain:0, md:null, attente:null };
const CELEBRATION=2.6, REPLACEMENT=3;    // secondes : la joie du buteur, puis le retour au rond central
const elFil=document.getElementById('fil');
function afficheLigne(l){
  const p=document.createElement('p');
  const m=document.createElement('span'); m.className='m'; m.textContent=String(l.m).padStart(2,'0')+"'";
  const t=document.createElement('span'); t.className='tx '+l.t; t.textContent=l.x;
  p.append(m,t); elFil.prepend(p);
  while(elFil.children.length>2) elFil.lastChild.remove();
  elMin.textContent=String(l.m).padStart(2,'0')+"'";
}
function appliqueLigne(l){
  const x=l.x||'';
  if(l.g){ etat.sc=[l.g.sh,l.g.sa]; elScore.textContent=etat.sc[0]+' - '+etat.sc[1]; dessinerEcran();
    banniere('BUT !', l.g.but, 2600);
    if(etat.phase!=='but'){ const j=joueurs.find(p=>p.nom===l.g.but); if(j){ etat.phase='but'; etat.buteur=j; etat.celebration=0; montrerNom(j,4);} }
  }
  if(l.t==='sys' && /^COUP DE SIFFLET FINAL/.test(x)){ etat.phase='fin'; ACT=null; banniere('FIN DU MATCH', '', 4000); }
  else if(l.t==='sys' && /^MI-TEMPS/.test(x)){ etat.phase='pause'; ACT=null; etat.attente=1.6; banniere('MI-TEMPS','',2000); }
  else if(l.t==='sys' && /Coup d'envoi/.test(x) && etat.phase==='avant'){ etat.phase='jeu'; placerCoupEnvoi('dom'); }
}
function avanceFil(dt){
  if(R.delai===0 || !TK.md) return;
  TK.horloge+=dt*1000;
  if(TK.horloge<TK.prochain) return;
  const ev=TK.md.ev; TK.i++;
  const l=ev[TK.i]; if(!l){ TK.md=null; return; }
  afficheLigne(l); appliqueLigne(l);
  /* après un but, le fil laisse le temps de fêter le but puis de rejouer le coup d'envoi avant la ligne suivante */
  const pause = l.t==='but' ? (CELEBRATION+REPLACEMENT+.4)*1000 : 0;
  TK.prochain=TK.horloge+R.delai+pause;
  const n=ev[TK.i+1]; TK.attente=null;
  if(n && etat.phase!=='fin'){ const info=lireLigne(n); if(info) TK.attente={info, debut:TK.prochain-R.delai*.94}; }
}
/* l'action de la ligne suivante démarre dès que le jeu a repris, et pas avant */
function lanceAttente(){
  const a=TK.attente; if(!a || TK.horloge<a.debut) return;
  if(etat.phase==='but' || etat.phase==='replacement') return;
  TK.attente=null;
  const reste=(TK.prochain-TK.horloge)/1000; if(reste>.35) lanceAction(a.info, reste);
}

/* ================================================================================================
   LES AMBIANCES : l'heure vient du créneau du match, la météo de la ligne du coup d'envoi
   ================================================================================================ */
const AMB = {
  jour:{fond:0xe9e1cf, soleil:[0xfff1d6,2.6], hemi:[0xfff4dc,0x4a5a3a,1.4], spots:0, pos:[-60,110,70]},
  soir:{fond:0xe7b98d, soleil:[0xffa060,1.6], hemi:[0xffd2a8,0x3a3048,.9], spots:1.6, pos:[-120,40,40]},
  nuit:{fond:0x121a2a, soleil:[0x8aa0d0,.35], hemi:[0x3a4a70,0x101418,.35], spots:4.2, pos:[60,110,-60]}
};
const ambC = { fond:new THREE.Color(AMB.jour.fond), sCol:new THREE.Color(0xfff1d6), sI:2.6, hCiel:new THREE.Color(0xfff4dc), hSol:new THREE.Color(0x4a5a3a), hI:1.4, spots:0, pos:new THREE.Vector3(-60,110,70) };
const METEO = { heure:'jour', ciel:'sec' };
function lireMeteo(md){
  const x=md.ev[0].x;
  METEO.heure=md.heure||'jour';
  METEO.ciel = /Il neige/.test(x)?'neige' : /Il pleut|champ de patates/.test(x)?'pluie' : /brouillard/.test(x)?'brouillard' : /gèle/.test(x)?'gel' : 'sec';
  if(/soleil rasant/.test(x) && METEO.heure==='jour') METEO.heure='soir';
  const neige = METEO.ciel==='neige'?.5 : METEO.ciel==='gel'?.22 : 0, boue = /champ de patates/.test(x)?.55 : METEO.ciel==='pluie'?.18:0;
  matPelouse.map.dispose(); matPelouse.map=texturePelouse(neige,boue); matPelouse.needsUpdate=true;
  scene.fog = METEO.ciel==='brouillard' ? new THREE.Fog(0xb9bcc0, 230, 330) : null;
}
function ambianceCible(){
  const a=AMB[METEO.heure], c=METEO.ciel, gris = c==='pluie'?.55 : c==='neige'?.8 : c==='brouillard'?.65 : 1;
  return { fond:new THREE.Color(a.fond).lerp(new THREE.Color(METEO.heure==='nuit'?0x0d121c:0x9aa3a8),1-gris), sCol:new THREE.Color(a.soleil[0]), sI:a.soleil[1]*gris,
    hCiel:new THREE.Color(a.hemi[0]), hSol:new THREE.Color(a.hemi[1]), hI:a.hemi[2]*(c==='sec'?1:.85), spots:a.spots*(c==='sec'?1:1.15), pos:new THREE.Vector3(...a.pos) };
}

/* ================================================================================================
   UN MATCH QUI COMMENCE
   ================================================================================================ */
function chargeMatch(idx){
  const md=MATCHS[idx]; etat.md=md; TK.md=md; TK.i=-1; TK.horloge=0; TK.prochain=600; TK.attente=null;
  ACT=null; etat.phase='avant'; etat.sc=[0,0]; etat.buteur=null; etat.corner=null;
  SENS.dom=1; SENS.ext=-1;
  const T=creerJoueurs(md);
  document.getElementById('cDom').textContent=md.dom.id; document.getElementById('cExt').textContent=md.ext.id;
  document.getElementById('pDom').style.background=T.dom.maillot; document.getElementById('pExt').style.background=T.ext.maillot;
  elScore.textContent='0 - 0'; elMin.textContent="00'"; elFil.textContent='';
  /* le public aux couleurs des deux clubs, le club qui reçoit en nombre */
  const cd=[T.dom.maillot,T.dom.maillot,T.dom.short,'#f4edd8','#2b2b2b','#3d5a80','#d9d2c0'], ce=[T.ext.maillot,T.ext.short];
  places.forEach((p,i)=>{ tmpM.makeTranslation(p.x,p.y,p.z); publicMesh.setMatrixAt(i,tmpM);
    const virageVisiteur = p.x>L/2+6 && p.z<0;
    p.camp = virageVisiteur ? 1 : 0;
    publicMesh.setColorAt(i,tmpC.set(virageVisiteur? ce[(rnd()*ce.length)|0] : cd[(rnd()*cd.length)|0])); });
  publicMesh.instanceMatrix.needsUpdate=true; publicMesh.instanceColor.needsUpdate=true;
  lireMeteo(md);
  placerCoupEnvoi('dom'); B.porteur=null;
  dessinerEcran();
  document.querySelectorAll('#gMatch button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===idx)));
}

/* ================================================================================================
   LA SIMULATION DE CHAQUE IMAGE
   ================================================================================================ */
function majJeu(dt){
  /* le ballon hors action */
  if(ACT) avanceAction(dt);
  else if(B.vol){
    const v=B.vol; v.t+=dt/v.d; const k=Math.min(1,v.t);
    B.pos.lerpVectors(v.de,v.a,k); B.pos.y=v.de.y+(v.a.y-v.de.y)*k+Math.sin(k*Math.PI)*v.haut;
    if(k>=1){ B.vol=null; B.porteur=v.recepteur; etat.decision=alea(.5,1.6); }
  } else if(B.filet){
    B.filet.t+=dt; const f=B.filet, k=Math.min(1,f.t/.35);
    B.pos.set(f.a.x+f.s*BUT_P*.85*k, Math.max(.62,f.a.y*(1-k*1.3)), f.a.z);
  } else if(B.libre){
    const b=B.libre; b.t+=dt; const k=Math.min(1,b.t/b.d);
    B.pos.lerpVectors(b.de,b.a,k); B.pos.y=b.de.y+(b.a.y-b.de.y)*k+Math.sin(k*Math.PI)*(b.haut||0);
    if(k>=1 && b.t>b.d+.35){
      B.libre=null;
      if(b.ensuite==='six'){ const gk=gardiens[b.camp]; if(gk){ gk.pos.set(-SENS[b.camp]*(L/2-5.5),0,alea(-6,6)); B.porteur=gk; gk.tient=.8; etat.decision=.8; } }
      else if(b.ensuite==='def'){ B.porteur=plusProche(equipe(b.camp).filter(j=>!j.gardien), B.pos)[0]; etat.decision=.6; }
    }
  } else if(B.porteur){
    const p=B.porteur, dir=p.vel.lengthSq()>.1?p.vel.clone().normalize():new THREE.Vector3(sens(p),0,0);
    if(p.gardien && p.tient>0) B.pos.set(p.pos.x+dir.x*.5,1.6,p.pos.z+dir.z*.5);
    else B.pos.set(p.pos.x+dir.x*1.4,.62,p.pos.z+dir.z*1.4);
  }

  if(etat.phase==='pause'){ etat.attente-=dt; if(etat.attente<=0){ SENS.dom*=-1; SENS.ext*=-1; placerCoupEnvoi('ext'); etat.phase='jeu'; } }
  if(etat.phase==='but'){ etat.celebration+=dt;
    if(etat.celebration>CELEBRATION && !ACT){            // tout le monde rentre, le ballon revient au point central
      etat.phase='replacement'; etat.replace=0; etat.envoi=postesEnvoi(adverse(etat.buteur.camp));
      B.filet=null; B.porteur=null; B.vol=null; B.libre={t:0,d:.9,de:B.pos.clone(),a:new THREE.Vector3(0,.62,0),haut:3}; } }
  if(etat.phase==='replacement'){ etat.replace+=dt;
    if(etat.replace>REPLACEMENT){                         // coup de sifflet : on engage en jouant en retrait
      const {eng, second}=etat.envoi; etat.phase='jeu';
      B.libre=null; B.pos.set(0,.62,0); B.porteur=eng;
      if(eng && second) passe(eng, second); etat.decision=alea(.8,1.4); } }

  /* où chacun veut aller */
  const bx=B.pos.x, bz=B.pos.z;
  const campBallon = ACT ? ACT.info.att : (B.porteur?.camp ?? B.vol?.recepteur?.camp ?? null);
  for(const c of ['dom','ext']){
    const eq=equipe(c);
    const presseur = (campBallon && campBallon!==c && etat.phase==='jeu') ? plusProche(eq.filter(j=>!j.gardien && !(ACT&&ACT.K.has(j))), B.pos)[0] : null;
    for(const j of eq){
      if(ACT && ACT.K.has(j)) continue;
      const s=sens(j);
      if(j.sortie){ j.cible.set(j.pos.x, 0, Lg/2+9); if(j.pos.z>Lg/2+7){ j.dehors=true; j.g.visible=false; } continue; }
      if(etat.phase==='but'){
        const b=etat.buteur, sb=sens(b);
        if(j===b) j.cible.set(sb*(L/2-3),0,Math.sign(b.pos.z||1)*(Lg/2-3));
        else if(j.camp===b.camp && !j.gardien) j.cible.copy(b.pos).add(new THREE.Vector3(Math.cos(j.num)*3.5,0,Math.sin(j.num)*3.5));
        else j.cible.set(j.base.x*30*s,0,j.base.z*28*s);
        continue;
      }
      if(etat.phase==='replacement'){ const p=etat.envoi.P.get(j); if(p) j.cible.copy(p); continue; }
      if(etat.phase==='fin'||etat.phase==='pause'){ j.cible.set(-s*4+(j.num-5)*2.2*s*.4, 0, (j.camp==='dom'?-3:3)+(j.num-5)*.2); continue; }
      if(etat.phase==='avant') { j.cible.copy(j.pos); continue; }
      if(etat.corner && B.libre==null && !ACT){ // on se place pour le corner
        const sc=SENS[etat.corner.tireur.camp];
        if(j===etat.corner.tireur){ j.cible.set(sc*(L/2-1.4),0,sc*etat.corner.side*(Lg/2-1.2)); continue; }
        if(!j.gardien){ j.cible.set(sc*(L/2-6-(j.num%4)*2.5), 0, sc*((j.num%5)-2)*3.2+(j.camp==='dom'?.8:-.8)); continue; }
      }
      if(j.gardien){ j.cible.set(-s*(L/2-2.5),0,clamp(bz*.18,-4,4)); continue; }
      if(j===B.porteur){ j.cible.set(j.pos.x+s*10,0,j.pos.z*.85); continue; }
      if(B.vol && B.vol.recepteur===j){ j.cible.copy(B.vol.a); j.cible.y=0; continue; }
      if(j===presseur){ j.cible.set(bx,0,bz); continue; }
      const attaque = campBallon===c ? 1 : 0;
      const x=j.base.x*48*.72*s + bx*.42 + s*attaque*9, z=j.base.z*30*.9*s + bz*.28;
      j.cible.set(clamp(x,-L/2+3,L/2-3),0,clamp(z,-Lg/2+2,Lg/2-2));
    }
  }
  for(const j of joueurs){
    if(j.dehors || (ACT && ACT.K.has(j))) continue;
    if(j.tombe>0){ j.tombe-=dt; j.vel.multiplyScalar(.85); continue; }
    const d=j.cible.clone().sub(j.pos); d.y=0; const dist=d.length();
    let vmax = j===B.porteur?6.8 : (B.vol?.recepteur===j?9.5 : 7.8);
    if(etat.phase==='but' && j===etat.buteur) vmax=9;
    if(etat.phase==='fin'||etat.phase==='pause') vmax=3;
    if(etat.phase==='replacement') vmax=16;
    const voulu = dist>.4 ? d.multiplyScalar(Math.min(vmax,dist*1.6)/dist) : d.set(0,0,0);
    j.vel.lerp(voulu, Math.min(1,dt*4)); j.pos.addScaledVector(j.vel,dt);
    if(j.tient){ j.tient-=dt; if(j.tient<=0) j.tient=0; }
  }
  for(let a=0;a<joueurs.length;a++) for(let b=a+1;b<joueurs.length;b++){
    const A=joueurs[a], Bj=joueurs[b]; if(A.dehors||Bj.dehors) continue;
    if(ACT && (ACT.K.has(A)||ACT.K.has(Bj))) continue;
    const dx=A.pos.x-Bj.pos.x, dz=A.pos.z-Bj.pos.z, d2=dx*dx+dz*dz;
    if(d2<4 && d2>1e-4){ const d=Math.sqrt(d2), k=(2-d)*.5/d; A.pos.x+=dx*k; A.pos.z+=dz*k; Bj.pos.x-=dx*k; Bj.pos.z-=dz*k; }
  }
  if(etat.phase==='jeu' && !ACT && B.porteur){
    const p=B.porteur; etat.decision-=dt;
    if(etat.decision<=0 && !p.tient){
      if(p.gardien){ const c=equipe(p.camp).filter(j=>!j.gardien); passe(p,c[(Math.random()*c.length)|0],true); etat.decision=alea(.8,1.6); }
      else decider(p);
    }
    if(B.porteur && !B.porteur.gardien){
      const [adv,d]=plusProche(equipe(adverse(p.camp)).filter(j=>!j.gardien), p.pos);
      if(adv && d<1.9 && Math.random()<dt*.7){ B.porteur=adv; etat.decision=alea(.4,1.2); }
    }
  }
}

function poserJoueurs(dt, now){
  for(const j of joueurs){
    if(j.dehors) continue;
    j.g.position.copy(j.pos);
    const v=j.vel.length();
    if(j.gardien && (j.plongeF || (ACT && ACT.gk===j && ACT.u>ACT.uTir-.1))) j.g.rotation.y = sens(j)>0 ? Math.PI/2 : -Math.PI/2; // face au jeu pour plonger de côté
    else if(v>.3) j.g.rotation.y=Math.atan2(j.vel.x,j.vel.z);
    j.phase+=dt*v*1.25;
    const a=Math.min(.9,v*.11)*Math.sin(j.phase);
    j.jambeG.rotation.x=a; j.jambeD.rotation.x=-a; j.brasG.rotation.x=-a*.8; j.brasD.rotation.x=a*.8;
    j.g.position.y=Math.abs(Math.sin(j.phase))*Math.min(.25,v*.03);
    j.brasG.rotation.z=0; j.brasD.rotation.z=0; j.g.rotation.x=0; j.g.rotation.z=0;
    if(etat.phase==='but' && etat.buteur && j.camp===etat.buteur.camp && !j.gardien){
      j.brasG.rotation.z=-2.6; j.brasD.rotation.z=2.6; j.brasG.rotation.x=j.brasD.rotation.x=0;
      j.g.position.y+=Math.abs(Math.sin(now/180+j.num))*.5;
    }
    if(j.tombe>0){ j.g.rotation.x=-Math.PI/2*Math.min(1,(1.6-j.tombe)*5); j.g.position.y=.3; }
    if(j.plongeReste>0){ j.plongeReste-=dt; if(j.plongeReste<=0) j.plongeF=0; }
    if(j.gardien && j.plongeF){ j.g.rotation.z = 1.35*Math.min(1,Math.abs(j.plongeF)*2)*Math.sign(j.plongeF)*sens(j); j.g.position.y=.25+Math.sin(Math.min(1,Math.abs(j.plongeF))*Math.PI)*.9; }
    /* l'étiquette du nom et le carton flottent au-dessus de la tête */
    const k = cam.demi*0.042;
    if(j.lab){ j.labT-=dt; j.lab.visible = j.labT>0; j.lab.position.set(j.pos.x, 7.2+k*.6, j.pos.z); j.lab.scale.set(k*j.lab.userData.ratio, k, 1); }
    if(j.crt){ j.crtT-=dt; j.crt.visible = j.crtT>0; j.crt.position.set(j.pos.x, 7.2+k*1.9, j.pos.z); j.crt.scale.set(k*1.1*.75, k*1.1, 1); }
  }
}

/* ---------- caméra isométrique ---------- */
const cam = { angle:Math.PI/4, angleCible:Math.PI/4, cible:new THREE.Vector3(), demi:80 };
const DECALAGE = TELEPHONE ? .3 : .16;    // le fil et les boutons couvrent le bas de l'écran : la scène remonte d'autant
function cadrage(){
  const asp=innerWidth/innerHeight;
  if(R.camera==='large' && etat.phase!=='but') return {cible:new THREE.Vector3(0,-4,0), demi:Math.max(72,104/asp)};
  const p = etat.phase==='but' && etat.buteur ? etat.buteur.pos : B.pos;
  return {cible:new THREE.Vector3(p.x*.85,0,p.z*.85), demi:Math.max(30,40/asp)*(etat.phase==='but'?.8:1)};
}
function placerCamera(dt){
  const c=cadrage(), k=Math.min(1,dt*(etat.phase==='but'?2.2:1.6));
  cam.cible.lerp(c.cible,k); cam.demi+=(c.demi-cam.demi)*k;
  cam.angle+=(cam.angleCible-cam.angle)*Math.min(1,dt*6);
  const el=.6, D=300;
  camera.position.set(cam.cible.x+Math.sin(cam.angle)*Math.cos(el)*D, cam.cible.y+Math.sin(el)*D, cam.cible.z+Math.cos(cam.angle)*Math.cos(el)*D);
  camera.lookAt(cam.cible);
  const asp=innerWidth/innerHeight;
  camera.left=-cam.demi*asp; camera.right=cam.demi*asp; camera.top=cam.demi*(1-DECALAGE); camera.bottom=-cam.demi*(1+DECALAGE);
  camera.updateProjectionMatrix();
}
let glisse=null;
canvas.addEventListener('pointerdown',e=>{ glisse={x:e.clientX,a:cam.angleCible}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(glisse) cam.angleCible=glisse.a-(e.clientX-glisse.x)*0.008; });
canvas.addEventListener('pointerup',()=>glisse=null);
canvas.addEventListener('pointercancel',()=>glisse=null);

function redimensionner(){ renderer.setSize(Math.max(160,Math.floor(innerWidth/R.pixels)), Math.max(120,Math.floor(innerHeight/R.pixels)), false); }
addEventListener('resize', redimensionner);

/* ---------- boutons ---------- */
const gM=document.getElementById('gMatch');
MATCHS.forEach((md,i)=>{ const b=document.createElement('button'); b.id='m-'+i; b.textContent=md.dom.id+'-'+md.ext.id; b.onclick=()=>chargeMatch(i); gM.append(b); });
document.querySelectorAll('#gVitesse button').forEach(b=>b.addEventListener('click',()=>{
  R.delai=Number(b.dataset.v); document.querySelectorAll('#gVitesse button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
}));
document.querySelectorAll('#gCamera button').forEach(b=>{
  b.setAttribute('aria-pressed',String(b.dataset.v===R.camera));
  b.addEventListener('click',()=>{ R.camera=b.dataset.v; document.querySelectorAll('#gCamera button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
});

/* ---------- boucle ---------- */
let avant=performance.now(), fondCss='';
function boucle(now){
  let dt=Math.min(.05,(now-avant)/1000); avant=now;
  const fige = R.delai===0;
  const dJeu = fige ? 0 : dt*(window.__vit||1);
  avanceFil(dJeu);
  majJeu(dJeu);
  lanceAttente();
  poserJoueurs(dJeu, now);
  ballon.position.copy(B.pos); if(!fige){ ballon.rotation.x+=dt*8; ballon.rotation.z+=dt*5; }

  const c=ambianceCible(), k=Math.min(1,dt*2);
  ambC.fond.lerp(c.fond,k); ambC.sCol.lerp(c.sCol,k); ambC.sI+=(c.sI-ambC.sI)*k; ambC.hCiel.lerp(c.hCiel,k); ambC.hSol.lerp(c.hSol,k);
  ambC.hI+=(c.hI-ambC.hI)*k; ambC.spots+=(c.spots-ambC.spots)*k; ambC.pos.lerp(c.pos,k);
  scene.background=ambC.fond; if(scene.fog) scene.fog.color.copy(ambC.fond);
  const hex='#'+ambC.fond.getHexString(); if(hex!==fondCss){ document.body.style.background=hex; fondCss=hex; }
  soleil.color.copy(ambC.sCol); soleil.intensity=ambC.sI; soleil.position.copy(ambC.pos);
  hemi.color.copy(ambC.hCiel); hemi.groundColor.copy(ambC.hSol); hemi.intensity=ambC.hI;
  for(const s of pylones) s.intensity=ambC.spots;
  matLampe.emissive.setHex(ambC.spots>.5?0xfff2c8:0x000000);

  /* le public saute quand son équipe marque */
  const tt=now/1000, fete = etat.phase==='but' ? (etat.buteur.camp==='dom'?0:1) : -1;
  for(let i=0;i<places.length;i++){
    const p=places[i];
    const saut = p.camp===fete ? Math.max(0,Math.sin(tt*9*p.k+p.ph))*1.4 : Math.max(0,Math.sin(tt*1.3*p.k+p.ph)-.92)*3;
    tmpM.makeTranslation(p.x,p.y+saut,p.z); publicMesh.setMatrixAt(i,tmpM);
  }
  publicMesh.instanceMatrix.needsUpdate=true;
  for(const f of filets){ const s=B.filet&&B.filet.s===f.s?Math.max(0,1-B.filet.t/1.2):0; f.fond.position.x=f.s*(BUT_P+s*1.4*Math.sin(tt*40)); }

  pluie.visible=METEO.ciel==='pluie'; flocons.visible=METEO.ciel==='neige';
  if(pluie.visible && !reduit){ for(let i=0;i<NP;i++){ const g=goutte[i]; g.y-=g.v*dt; if(g.y<0){g.y=alea(60,90);g.x=alea(-ileL/2,ileL/2);g.z=alea(-ileP/2,ileP/2);} pluiePos.set([g.x,g.y,g.z,g.x+.6,g.y+3.2,g.z+.4],i*6); } pluieGeo.attributes.position.needsUpdate=true; }
  if(flocons.visible && !reduit){ for(let i=0;i<NP;i++){ const g=goutte[i]; g.y-=g.v*.09*dt; g.x+=Math.sin(tt+i)*dt*2; if(g.y<0){g.y=alea(60,90);g.x=alea(-ileL/2,ileL/2);g.z=alea(-ileP/2,ileP/2);} neigePos.set([g.x,g.y,g.z],i*3); } neigeGeo.attributes.position.needsUpdate=true; }
  const blanc = METEO.ciel==='neige'||METEO.ciel==='gel';
  herbeBord.color.lerp(new THREE.Color(blanc?0xdfe6ea:0x4f8f3a), Math.min(1,dt*2));
  matSapin.color.lerp(new THREE.Color(blanc?0xcfdcd8:0x2f6b3a), Math.min(1,dt*2));
  matPelouse.color.lerp(new THREE.Color(METEO.ciel==='pluie'?0x9fb0a0:0xffffff), k);

  placerCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(boucle);
}

redimensionner();
chargeMatch(0);
cam.demi=cadrage().demi;
if(document.fonts) document.fonts.ready.then(dessinerEcran);
requestAnimationFrame(boucle);
</script>
