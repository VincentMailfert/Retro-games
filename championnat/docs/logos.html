<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logos Multiplex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070f1b; --nuit:#0b1626; --panel:#10233f; --panel2:#0e1d35; --line:#27466e;
    --txt:#d9e4f2; --dim:#7e96b5; --jaune:#ffd24a; --rouge:#ff6f61; --clair:#f2f5fa;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--txt); font-family:'IBM Plex Sans',system-ui,sans-serif; line-height:1.5}
  main{max-width:1180px; margin:0 auto; padding:48px 16px 80px}
  header{margin-bottom:40px}
  .sur{font-family:'VT323',monospace; font-size:22px; color:var(--dim); letter-spacing:.06em}
  h1{font-family:'Silkscreen',monospace; font-weight:700; color:var(--jaune); font-size:clamp(28px,5vw,44px); margin:4px 0 8px; letter-spacing:.04em}
  header p{color:var(--dim); margin:0; max-width:60ch}

  .v{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:0; margin:0 0 28px;
     background:var(--panel2); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .scene{display:flex; align-items:center; justify-content:center; padding:44px 32px; min-height:340px;
     background:radial-gradient(120% 90% at 50% 40%, #13294a 0%, var(--nuit) 60%, #060d18 100%)}
  .scene svg{width:100%; height:auto; max-height:320px; overflow:visible}
  .fiche{padding:28px 26px; display:flex; flex-direction:column; gap:18px; border-left:1px solid var(--line)}
  .num{font-family:'Silkscreen',monospace; color:var(--jaune); font-size:14px; letter-spacing:.12em}
  .fiche h2{margin:2px 0 0; font-size:24px; font-weight:600; color:var(--clair)}
  .fiche p{margin:0; color:var(--dim); font-size:15px}
  .lbl{font-family:'VT323',monospace; color:var(--dim); font-size:18px; letter-spacing:.05em; margin-bottom:6px}
  .tuiles{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
  .tuiles figure{margin:0; display:flex; flex-direction:column; align-items:center; gap:6px}
  .tuiles figcaption{font-family:'VT323',monospace; color:var(--dim); font-size:15px}
  .barre{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--jaune); color:#16243c;
     border-radius:6px; padding:7px 10px; font-family:'Silkscreen',monospace; font-weight:700; font-size:15px}
  .barre span{display:flex; align-items:center; gap:8px}
  .barre small{font-family:'VT323',monospace; font-weight:400; font-size:17px}
  .ecran{background:var(--nuit); border:1px solid var(--line); border-radius:10px; padding:18px 12px; text-align:center}
  .ecran svg{width:100%; max-width:260px; height:auto}

  @media(max-width:820px){
    .v{grid-template-columns:1fr}
    .fiche{border-left:0; border-top:1px solid var(--line)}
    .scene{min-height:0; padding:32px 16px}
  }

  /* animations discrètes */
  .onde{animation:onde 2.4s ease-in-out infinite}
  .onde.b{animation-delay:.4s}
  @keyframes onde{0%,100%{opacity:.25}50%{opacity:1}}
  .clign{animation:clign 1.2s steps(1) infinite}
  @keyframes clign{50%{opacity:.12}}
  .tourne{transform-box:fill-box; transform-origin:center; animation:tourne 6s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .aiguille{animation:aiguille 2.6s cubic-bezier(.22,1,.36,1) both}
  @keyframes aiguille{0%{transform:translateX(-250px)}70%{transform:translateX(14px)}100%{transform:translateX(0)}}
  @media (prefers-reduced-motion:reduce){ .onde,.clign,.tourne,.aiguille{animation:none} }
</style>
</head>
<body>

<!-- définitions partagées -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="filet" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0 L7 7 M7 0 L0 7" stroke="#ffd24a" stroke-opacity=".5" stroke-width="1"/>
    </pattern>
    <pattern id="filetPlein" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#0b1626"/><path d="M0 0 L5 5 M5 0 L0 5" stroke="#ffd24a" stroke-opacity=".55" stroke-width=".8"/>
    </pattern>
    <pattern id="trousClair" width="3.4" height="3.4" patternUnits="userSpaceOnUse">
      <rect width="3.4" height="3.4" fill="#f2f5fa"/><circle cx="1.7" cy="1.7" r=".72" fill="#8a9bb4"/>
    </pattern>
    <pattern id="trousNuit" width="3.4" height="3.4" patternUnits="userSpaceOnUse">
      <rect width="3.4" height="3.4" fill="#0b1626"/><circle cx="1.7" cy="1.7" r=".7" fill="#33507a"/>
    </pattern>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe588"/><stop offset=".55" stop-color="#ffd24a"/><stop offset="1" stop-color="#e7b12a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbea"/><stop offset=".44" stop-color="#ffe07a"/>
      <stop offset=".5" stop-color="#c98a14"/><stop offset=".56" stop-color="#ffd24a"/><stop offset="1" stop-color="#fff0b0"/>
    </linearGradient>
    <linearGradient id="trainee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd24a" stop-opacity="0"/><stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="chromeArgent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".44" stop-color="#dfe7f2"/>
      <stop offset=".5" stop-color="#6d7f99"/><stop offset=".56" stop-color="#c9d4e3"/><stop offset="1" stop-color="#f5f8fc"/>
    </linearGradient>
    <linearGradient id="traineeRouge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f61" stop-opacity="0"/><stop offset="1" stop-color="#ff6f61"/>
    </linearGradient>
    <radialGradient id="vitre" cx=".5" cy=".55" r=".7">
      <stop offset="0" stop-color="#2b2410"/><stop offset=".55" stop-color="#121a22"/><stop offset="1" stop-color="#08101c"/>
    </radialGradient>
    <linearGradient id="caisse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15294a"/><stop offset="1" stop-color="#0a1426"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloFort" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<main>
  <header>
    <div class="sur">MULTIPLEX · atelier</div>
    <h1>Cinq logos</h1>
    <p>Chaque piste en grand, puis en icône (de 120 à 16 pixels) et dans la barre jaune du jeu.</p>
  </header>
  <div id="pistes"></div>
</main>

<script>
const C={nuit:'#0b1626',panel:'#10233f',panel2:'#0e1d35',ligne:'#27466e',txt:'#d9e4f2',dim:'#7e96b5',jaune:'#ffd24a',rouge:'#ff6f61',clair:'#f2f5fa',encre:'#16243c'};
let uid=0;
const rad=a=>a*Math.PI/180;

/* ---------- ballon ---------- */
function ballon(cx,cy,r,encre=C.nuit,papier=C.clair,plein=encre){
  const id='cb'+(uid++);
  const pt=(ox,oy,d,a)=>[ox+Math.cos(rad(a))*d*r, oy+Math.sin(rad(a))*d*r];
  const penta=(ox,oy,d,rot)=>'<polygon points="'+[0,1,2,3,4].map(k=>pt(ox,oy,d,rot+72*k).map(v=>v.toFixed(2)).join(',')).join(' ')+'"/>';
  let s=`<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${papier}"/>
    <g clip-path="url(#${id})" fill="${plein}" stroke="${encre}" stroke-width="${(r*.08).toFixed(2)}" stroke-linejoin="round">`;
  s+=penta(cx,cy,.36,-90);
  for(let k=0;k<5;k++){
    const a=-90+72*k, [ox,oy]=pt(cx,cy,1.04,a), [x1,y1]=pt(cx,cy,.36,a), [x2,y2]=pt(cx,cy,.68,a);
    s+=penta(ox,oy,.38,a+180)+`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none"/>`;
  }
  return s+`</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${encre}" stroke-width="${(r*.1).toFixed(2)}"/>`;
}

/* ---------- 1. transistor ---------- */
function transistor(v={}){
  const hp = v.hp==='ballon'
    ? ballon(45,75,21,C.jaune,'url(#filetPlein)',C.nuit)
    : `<rect x="19" y="53" width="52" height="44" rx="4" fill="${C.nuit}"/>
  <rect x="19" y="53" width="52" height="44" rx="4" fill="url(#filet)"/>
  ${ballon(58,84,9.5)}`;
  const bouton = v.bouton==='ballon'
    ? `<g class="tourne">${ballon(90,68,13)}</g>`
    : `<circle cx="90" cy="68" r="12" fill="none" stroke="${C.nuit}" stroke-width="4.5"/>
  <path d="M90 68 L97 61" stroke="${C.nuit}" stroke-width="4" stroke-linecap="round"/>`;
  return `
  <path d="M40 44 L24 16" stroke="${C.clair}" stroke-width="4" stroke-linecap="round"/>
  <circle cx="24" cy="16" r="5" fill="${C.clair}"/>
  <path class="onde" d="M33 9 a11 11 0 0 1 0 14" stroke="${C.jaune}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path class="onde b" d="M39 4 a18 18 0 0 1 0 24" stroke="${C.jaune}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <rect x="10" y="44" width="100" height="62" rx="10" fill="url(#corps)"/>
  ${hp}
  ${bouton}
  <rect x="79" y="87" width="6" height="9" rx="1.5" fill="${C.nuit}"/>
  <rect x="88" y="87" width="6" height="9" rx="1.5" fill="${C.nuit}"/>
  <rect x="97" y="87" width="6" height="9" rx="1.5" fill="${C.rouge}"/>`;
}
function lockup1(v={}){
  return `<svg viewBox="0 0 720 170" role="img" aria-label="Logo Multiplex, le transistor">
    <g transform="translate(0 4) scale(1.32)">${transistor(v)}</g>
    <text x="188" y="102" font-family="Silkscreen" font-weight="700" font-size="72" fill="${C.jaune}" textLength="522" lengthAdjust="spacingAndGlyphs">MULTIPLEX</text>
    <text x="191" y="142" font-family="VT323" font-size="30" fill="${C.dim}" letter-spacing="1">le foot français des années 90, en direct</text>
  </svg>`;
}

/* ---------- 2. tableau LED ---------- */
const FONTE={
  M:["10001","11011","10101","10101","10001","10001","10001"],
  U:["10001","10001","10001","10001","10001","10001","01110"],
  L:["10000","10000","10000","10000","10000","10000","11111"],
  T:["11111","00100","00100","00100","00100","00100","00100"],
  I:["01110","00100","00100","00100","00100","00100","01110"],
  P:["11110","10001","10001","11110","10000","10000","10000"],
  E:["11111","10000","10000","11110","10000","10000","11111"],
  X:["10001","10001","01010","00100","01010","10001","10001"],
  N:["10001","11001","10101","10011","10001","10001","10001"],
  D:["11110","10001","10001","10001","10001","10001","11110"],
  R:["11110","10001","10001","11110","10100","10010","10001"],
  C:["01110","10001","10000","10000","10000","10001","01110"],
  F:["11111","10000","10000","11110","10000","10000","10000"],
  O:["01110","10001","10001","10001","10001","10001","01110"],
  "9":["01110","10001","10001","01111","00001","00010","01100"],
  "0":["01110","10001","10011","10101","11001","10001","01110"],
  "'":["00100","00100","01000","00000","00000","00000","00000"],
  " ":["00000","00000","00000","00000","00000","00000","00000"]
};
function led(texte,{pas=10,point=.36,allume=C.jaune,eteint='#15263e',mx=1,my=1,classe=''}={}){
  const cols=texte.length*6-1+2*mx, lignes=7+2*my, on=new Set();
  [...texte].forEach((ch,i)=>(FONTE[ch]||FONTE[' ']).forEach((row,y)=>[...row].forEach((b,x)=>{ if(b==='1') on.add((mx+i*6+x)+','+(my+y)); })));
  let a='',e='';
  for(let y=0;y<lignes;y++) for(let x=0;x<cols;x++){
    const c=`<circle cx="${((x+.5)*pas).toFixed(1)}" cy="${((y+.5)*pas).toFixed(1)}" r="${(point*pas).toFixed(2)}"/>`;
    on.has(x+','+y)?a+=c:e+=c;
  }
  return {l:cols*pas,h:lignes*pas,svg:`<g fill="${eteint}">${e}</g><g fill="${allume}" filter="url(#halo)" class="${classe}">${a}</g>`};
}
function vis(x,y){ return `<circle cx="${x}" cy="${y}" r="5" fill="#1d3558"/><path d="M${x-3} ${y+3} L${x+3} ${y-3}" stroke="#0a1426" stroke-width="1.6"/>`; }
function lockup2(bas='EN DIRECT',clign=true){
  const h=led('MULTIPLEX',{pas:10}), d=led(bas,{pas:5,allume:C.rouge,classe:clign?'clign':''}), m=led("90'",{pas:5});
  const W=h.l+60, H=30+h.h+14+d.h+28;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Logo Multiplex, tableau d'affichage">
    <rect x="1" y="1" width="${W-2}" height="${H-2}" rx="16" fill="#060e1a" stroke="${C.ligne}" stroke-width="2"/>
    <rect x="18" y="18" width="${W-36}" height="${H-36}" rx="8" fill="#08121f"/>
    ${vis(14,14)}${vis(W-14,14)}${vis(14,H-14)}${vis(W-14,H-14)}
    <g transform="translate(30 30)">${h.svg}</g>
    <g transform="translate(30 ${30+h.h+14})">${d.svg}</g>
    <g transform="translate(${W-30-m.l} ${30+h.h+14})">${m.svg}</g>
  </svg>`;
}
function tuile2(){
  const g=led('M',{pas:12});
  return `<g transform="translate(${(120-g.l)/2} ${(120-g.h)/2})">${g.svg}</g>`;
}

/* ---------- 3. écusson ---------- */
const BOUCLIER="M14 14 H106 V70 C106 104 60 132 60 132 C60 132 14 104 14 70 Z";
function etoile(cx,cy,R){ const p=[]; for(let k=0;k<10;k++){const r=k%2?R*.42:R, a=rad(-90+36*k); p.push((cx+Math.cos(a)*r).toFixed(2)+','+(cy+Math.sin(a)*r).toFixed(2));} return `<polygon points="${p.join(' ')}" fill="${C.jaune}"/>`; }
function ecusson(ruban=true){
  const id='cs'+(uid++), by=ruban?54:66, br=ruban?11:15;
  let bandes=''; for(let x=20;x<106;x+=12) bandes+=`<rect x="${x}" y="14" width="6" height="120" fill="#0f2140"/>`;
  const ondes=(s)=>{ const k=ruban?1:1.25; return `<g stroke="${C.jaune}" stroke-width="${3*k}" fill="none" stroke-linecap="round">
      <path class="onde" d="M${60-s*(br+6)} ${by-9*k} a${13*k} ${13*k} 0 0 ${s>0?0:1} 0 ${18*k}"/>
      <path class="onde b" d="M${60-s*(br+13)} ${by-14*k} a${20*k} ${20*k} 0 0 ${s>0?0:1} 0 ${28*k}"/></g>`; };
  return `
  <clipPath id="${id}"><path d="${BOUCLIER}"/></clipPath>
  <path d="${BOUCLIER}" fill="${C.nuit}"/>
  <g clip-path="url(#${id})">${bandes}</g>
  <path d="${BOUCLIER}" fill="none" stroke="${C.jaune}" stroke-width="4"/>
  <path d="${BOUCLIER}" transform="translate(60 72) scale(.86) translate(-60 -72)" fill="none" stroke="${C.jaune}" stroke-opacity=".45" stroke-width="1.2"/>
  ${etoile(60,1,9)}
  ${ondes(1)}${ondes(-1)}
  ${ballon(60,by,br)}
  ${ruban?`
  <polygon points="-2,90 16,90 16,110 -2,110 5,100" fill="#b98d18"/>
  <polygon points="122,90 104,90 104,110 122,110 115,100" fill="#b98d18"/>
  <polygon points="10,104 16,104 16,110" fill="#7c5e0e"/>
  <polygon points="110,104 104,104 104,110" fill="#7c5e0e"/>
  <rect x="10" y="82" width="100" height="22" fill="${C.jaune}"/>
  <text x="60" y="97.5" text-anchor="middle" font-family="Silkscreen" font-weight="700" font-size="13" fill="${C.encre}" textLength="86" lengthAdjust="spacingAndGlyphs">MULTIPLEX</text>
  <text x="60" y="116" text-anchor="middle" font-family="VT323" font-size="10" fill="${C.jaune}" letter-spacing=".5">D1 · 90</text>`:''}`;
}
function lockup3(){
  return `<svg viewBox="-8 -14 136 150" role="img" aria-label="Logo Multiplex, l'écusson" style="max-height:330px">${ecusson(true)}</svg>`;
}
function tuile3(){ return `<g transform="translate(60 62) scale(.74) translate(-60 -66)">${ecusson(false)}</g>`; }

/* ---------- 4. générique télé ---------- */
function chromeTexte(t,x,y,taille,long,prof,o={}){
  const L=long?`textLength="${long}" lengthAdjust="spacingAndGlyphs"`:'', ext=o.ext||['#b8392f','#5e1712'];
  const base=`font-family="Archivo Black" font-size="${taille}" text-anchor="middle" ${L}`;
  if(o.neon) return `<text x="${x}" y="${y}" ${base} fill="${C.nuit}" stroke="${C.jaune}" stroke-width="${taille/30}" stroke-linejoin="round" filter="url(#haloFort)">${t}</text>`;
  let s='';
  for(let i=prof;i>=1;i--) s+=`<text x="${x+i}" y="${y+i}" ${base} fill="${i===prof?ext[1]:ext[0]}">${t}</text>`;
  return s+`<text x="${x}" y="${y}" ${base} fill="url(#${o.grad||'chrome'})" stroke="${C.nuit}" stroke-width="${taille/26}" paint-order="stroke">${t}</text>`;
}
/* v : tag (slogan), grad, ext, bandeau [fond, encre], neon, plaque */
function lockup4(v={}){
  const tag=v.tag||'TOUS LES BUTS, EN DIRECT', band=v.bandeau||[C.rouge,C.nuit], trainee=v.neon?'traineeRouge':'trainee';
  const slogan = v.neon
    ? `<text x="57" y="250" font-family="VT323" font-size="30" fill="${C.rouge}" letter-spacing="2" filter="url(#halo)">${tag}</text>`
    : `<polygon points="61.8,226 399.8,226 392.8,258 54.8,258" fill="${band[0]}"/>
    <text x="74" y="250" font-family="VT323" font-size="28" fill="${band[1]}" textLength="312" lengthAdjust="spacingAndGlyphs">${tag}</text>`;
  return `<svg viewBox="0 0 780 272" role="img" aria-label="Logo Multiplex, générique télé">
    ${v.plaque?`<polygon points="44,30 776,30 756,214 24,214" fill="${C.panel}" stroke="${C.jaune}" stroke-width="3"/>
    <path d="M40 44 H762" stroke="${C.jaune}" stroke-opacity=".35" stroke-width="1.5"/>`:''}
    <path d="M40 200 C 210 168, 470 158, 684 176" stroke="url(#${trainee})" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M110 214 C 270 188, 480 178, 676 190" stroke="url(#${trainee})" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
    <g transform="translate(34 0) skewX(-12)">${chromeTexte('MULTIPLEX',390,152,118,640,9,v)}</g>
    ${ballon(708,178,19)}
    ${slogan}
  </svg>`;
}
function tuile4(){
  return `<path d="M10 100 C 40 90, 70 86, 96 90" stroke="url(#trainee)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g transform="translate(14 0) skewX(-10)">${chromeTexte('M',60,84,84,null,6)}</g>
    ${ballon(100,90,11)}`;
}

/* ---------- 5. la fréquence ---------- */
function echelle(y,x0,x1,pas,grands,etiquettes,coul){
  let s=`<path d="M${x0} ${y} H${x1}" stroke="${coul}" stroke-opacity=".6" stroke-width="1.5"/>`;
  for(let x=x0,i=0;x<=x1;x+=pas,i++){ const g=i%grands===0; s+=`<path d="M${x} ${y} v${g?-10:-5}" stroke="${coul}" stroke-opacity="${g?.8:.45}" stroke-width="${g?2:1.2}"/>`; }
  etiquettes.forEach((t,i)=>{ const x=x0+(x1-x0)*(i+.5)/etiquettes.length; s+=`<text x="${x}" y="${y-15}" text-anchor="middle" font-family="VT323" font-size="17" fill="#e9dcae" fill-opacity=".75">${t}</text>`; });
  return s;
}
function lockup5(){
  const coul='#e9dcae';
  return `<svg viewBox="0 0 640 262" role="img" aria-label="Logo Multiplex, le cadran radio">
    <rect x="1" y="1" width="638" height="260" rx="20" fill="url(#caisse)" stroke="${C.ligne}" stroke-width="2"/>
    <rect x="24" y="22" width="592" height="130" rx="10" fill="url(#vitre)" stroke="#060d18" stroke-width="3"/>
    <g font-family="VT323" font-size="20" fill="${C.dim}"><text x="40" y="58">GO</text><text x="40" y="98">OM</text><text x="40" y="138">FM</text></g>
    ${echelle(56,84,596,8,8,['NANTES','AUXERRE','MARSEILLE','PARIS','MONACO','BORDEAUX'],coul)}
    ${echelle(96,84,596,8,8,['530','600','800','1000','1300','1600'],coul)}
    ${echelle(136,84,596,8,8,['88','92','96','100','104','108'],coul)}
    <g class="aiguille"><rect x="338" y="28" width="4" height="118" rx="2" fill="${C.rouge}" filter="url(#halo)"/></g>
    <text x="320" y="222" text-anchor="middle" font-family="Silkscreen" font-weight="700" font-size="58" fill="${C.jaune}" filter="url(#haloFort)" textLength="500" lengthAdjust="spacingAndGlyphs">MULTIPLEX</text>
  </svg>`;
}
function tuile5(){
  let s=`<rect x="12" y="26" width="96" height="68" rx="8" fill="url(#vitre)" stroke="#060d18" stroke-width="2"/>`;
  [48,70,90].forEach(y=>{ s+=`<path d="M20 ${y} H100" stroke="#e9dcae" stroke-opacity=".55" stroke-width="2"/>`; for(let x=20;x<=100;x+=10) s+=`<path d="M${x} ${y} v-6" stroke="#e9dcae" stroke-opacity=".55" stroke-width="2"/>`; });
  return s+`<rect x="56" y="30" width="7" height="60" rx="3" fill="${C.rouge}" filter="url(#halo)"/>`;
}

/* ---------- mise en page ---------- */
const tuile=(contenu,taille)=>`<svg width="${taille}" height="${taille}" viewBox="0 0 120 120"><rect width="120" height="120" rx="26" fill="${C.nuit}"/><rect x=".75" y=".75" width="118.5" height="118.5" rx="25.5" fill="none" stroke="${C.ligne}" stroke-width="1.5"/>${contenu}</svg>`;
const tuile1=(v={})=>`<g transform="translate(60 62) scale(.9) translate(-60 -60)">${transistor(v)}</g>`;

const PISTES=[
  {nom:'Le transistor', pitch:"Le logo actuel, repris au propre : la radio du samedi soir, le haut-parleur en filet de but, le ballon au fond.", grand:lockup1, t:tuile1, num:'01'},
  {nom:'Le transistor, bouton ballon', pitch:"Le bouton des stations devient un ballon, et il tourne.", grand:()=>lockup1({bouton:'ballon'}), t:()=>tuile1({bouton:'ballon'}), num:'01-1'},
  {nom:'Le transistor, haut-parleur ballon', pitch:"La grille du haut-parleur prend la forme du ballon : même filet, même couleurs.", grand:()=>lockup1({hp:'ballon'}), t:()=>tuile1({hp:'ballon'}), num:'01-2'},
  {nom:"Le tableau d'affichage", pitch:"Le nom en ampoules, comme au-dessus d'une tribune. Rien d'autre qu'un écran de stade la nuit.", grand:lockup2, t:tuile2, num:'02'},
  {nom:"Le tableau, FOOT RETRO", pitch:"Même panneau, la ligne rouge dit ce qu'est le jeu.", grand:()=>lockup2('FOOT RETRO',false), t:tuile2, num:'02-1'},
  {nom:"L'écusson", pitch:"Un blason de club : l'étoile, le ballon qui émet, le ruban. On joue pour un maillot.", grand:lockup3, t:tuile3},
  {nom:'Le générique télé', pitch:"Lettres chromées, italique, trajectoire de frappe : l'ouverture d'une émission de foot en 1994.", grand:lockup4, t:tuile4, num:'04'},
  {nom:'Générique, le plaisir', pitch:"Le même, avec le nouveau slogan.", grand:()=>lockup4({tag:'LE PLAISIR DU FOOT RETRO'}), t:tuile4, num:'04-1'},
  {nom:'Générique, bleu blanc rouge', pitch:"Chrome argent, relief bleu, bandeau rouge : les couleurs de l'équipe de France.", grand:()=>lockup4({tag:'LE PLAISIR DU FOOT RETRO',grad:'chromeArgent',ext:['#3552a8','#152450']}), t:tuile4, num:'04-2'},
  {nom:'Générique, néon', pitch:"Plus de chrome : des tubes jaunes allumés dans la nuit, la frappe en rouge.", grand:()=>lockup4({tag:'LE PLAISIR DU FOOT RETRO',neon:true}), t:tuile4, num:'04-3'},
  {nom:'Générique, plaque télé', pitch:"Le titre posé sur une plaque, comme un habillage d'antenne.", grand:()=>lockup4({tag:'LE PLAISIR DU FOOT RETRO',plaque:true,bandeau:[C.jaune,C.encre]}), t:tuile4, num:'04-4'},
  {nom:'La fréquence', pitch:"Le cadran d'un poste : l'aiguille rouge se cale entre les villes, sur toutes les ondes à la fois. OM compris.", grand:lockup5, t:tuile5},
];
document.getElementById('pistes').innerHTML=PISTES.map((p,i)=>`
  <section class="v">
    <div class="scene">${p.grand()}</div>
    <div class="fiche">
      <div><div class="num">PISTE ${p.num||"0"+(i-6)}</div><h2>${p.nom}</h2></div>
      <p>${p.pitch}</p>
      <div><div class="lbl">icône</div>
        <div class="tuiles">${[96,56,32,16].map(s=>`<figure>${tuile(p.t(),s)}<figcaption>${s}</figcaption></figure>`).join('')}</div>
      </div>
      <div><div class="lbl">dans le jeu</div>
        <div class="barre"><span>${tuile(p.t(),22)}MULTIPLEX</span><small>Division 1 française</small></div>
      </div>
    </div>
  </section>`).join('');
</script>
