<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiplex stade pixel art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1626; --panel:#10233f; --panel2:#0e1d35; --line:#27466e;
    --txt:#d9e4f2; --dim:#8fa6c4; --clair:#f2f5fa; --jaune:#ffd24a;
    --font-texte:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-ui:'VT323','Lucida Console',monospace; --font-led:'Silkscreen','VT323',monospace;
  }
  /* Le jeu vit la nuit : même palette en clair comme en sombre, volontairement. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1626; } }
  :root[data-theme="dark"]{ --bg:#0b1626; }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{ box-sizing:inherit; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--txt); font-family:var(--font-texte); font-size:15px; line-height:1.5; }
  .page{ max-width:980px; margin:0 auto; padding:18px 16px 50px; }
  .jeu{ font-family:var(--font-led); color:var(--jaune); font-size:12px; }
  h1{ font-family:var(--font-ui); font-weight:normal; font-size:38px; line-height:1; color:var(--clair); margin:4px 0 14px; }
  .cadre{ position:relative; border:4px solid #1b2c49; background:#070b1a; box-shadow:inset 0 0 0 2px #000, 0 0 0 2px #000, 4px 4px 0 2px rgba(0,0,0,.55); }
  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  .legende{ position:absolute; left:10px; right:10px; bottom:8px; display:flex; justify-content:space-between; gap:10px; font-family:var(--font-led); font-size:13px; pointer-events:none; }
  .legende b{ font-weight:normal; color:var(--jaune); text-shadow:0 0 2px currentColor,0 1px 0 rgba(0,0,0,.6); }
  .legende span{ color:var(--clair); text-shadow:0 1px 0 rgba(0,0,0,.6); }
  .pupitre{ margin-top:18px; background:var(--panel); border:2px solid var(--line); box-shadow:5px 5px 0 #040a14; padding:16px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 22px; }
  @media (max-width:640px){ .pupitre{ grid-template-columns:1fr; } h1{ font-size:32px; } }
  label.r{ display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-bottom:4px; }
  label.r output{ color:var(--txt); font-variant-numeric:tabular-nums; }
  input[type=range]{ width:100%; accent-color:var(--jaune); min-height:28px; }
  .seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; }
  .seg button{ font-family:inherit; font-size:13px; min-height:44px; padding:6px 4px; color:var(--dim); background:#1a3052; border:2px solid #000; box-shadow:inset 2px 2px 0 rgba(255,255,255,.1), inset -2px -2px 0 rgba(0,0,0,.45); cursor:pointer; }
  .seg button[aria-pressed="true"]{ background:#0c1830; border-color:var(--jaune); color:var(--jaune); box-shadow:inset 2px 2px 0 rgba(0,0,0,.6); }
  .seg button:disabled{ opacity:.45; cursor:not-allowed; }
  button:focus-visible,input:focus-visible{ outline:2px solid var(--jaune); outline-offset:2px; }
  .titre{ font-size:13px; color:var(--dim); margin-bottom:5px; }
  .familles{ grid-column:1 / -1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 22px; border-top:2px solid var(--line); padding-top:14px; }
  @media (max-width:640px){ .familles{ grid-template-columns:1fr; } }
  .familles .seg button{ font-size:12px; }
</style>
</head>
<body>
<div class="page">
  <div class="jeu">MULTIPLEX · PROTOTYPE</div>
  <h1>Le stade en vrai pixel art</h1>
  <div class="cadre">
    <canvas id="ecran" width="320" height="224" role="img" aria-label="Maquette du stade en pixel art"></canvas>
    <div class="legende"><b id="etape"></b><span id="places"></span></div>
  </div>
  <div class="pupitre">
    <div><label class="r" for="rMois">Mois <output id="moisOut"></output></label><input type="range" id="rMois" min="0" max="11" step="1" value="8"></div><div><div class="titre">Le temps qu'il fait</div><div class="seg"><button type="button" id="bSem">Une autre semaine</button></div></div>
    <div style="grid-column:1 / -1"><div class="titre">Finesse du dessin</div><div class="seg" id="segFin"><button type="button" data-e="1" aria-pressed="true">320</button><button type="button" data-e="1.5" aria-pressed="false">480</button><button type="button" data-e="2" aria-pressed="false">640</button></div></div>
    <div><label class="r" for="rCap">Capacité <output id="capOut"></output></label><input type="range" id="rCap" min="5000" max="100000" step="500" value="22500"></div>
    <div><label class="r" for="rAff">Remplissage <output id="affOut"></output></label><input type="range" id="rAff" min="0" max="100" step="1" value="80"></div>
    <div><div class="titre">Travaux</div><div class="seg"><button type="button" id="bVir" aria-pressed="false">Virages</button><button type="button" id="bToit" aria-pressed="false">Toiture</button><button type="button" id="bEcran" aria-pressed="false">Écran géant</button></div></div>
    <div><div class="titre">Éclairage</div><div class="seg" id="segEcl"><button type="button" data-e="1" aria-pressed="true">Mâts</button><button type="button" data-e="2" aria-pressed="false">Pylônes</button><button type="button" data-e="3" aria-pressed="false">Rampe de toit</button></div></div>
    <div class="familles" id="familles"></div>
  </div>
</div>
<script>
/* ============================================================
   STADEPIX : LE STADE EN VRAI PIXEL ART
   Chaque pixel est posé exprès sur une petite grille (320 x 224), avec une palette fermée. Ce n'est pas un filtre
   passé sur un dessin : le moteur trace des polygones pleins, sans lissage, puis des contours à l'encre.
   Mêmes règles que la maquette d'origine pour la taille des tribunes (rangs, virages, uniformisation).
   ============================================================ */
const STADEPIX=(()=>{
const GW=320, GH=224, L=105, W=70, D=5, RZ=3.2;
const PLACES_VIRAGES=5000;
const PALIERS=[[5000,"Stade municipal"],[12000,"Stade de Division 1"],[20000,"Grande enceinte"],[30000,"Enceinte internationale"],[50000,"Arène européenne"],[75000,"Cathédrale du football"]];
function etape(cap){ let e=PALIERS[0][1]; for(const [s,n] of PALIERS) if(cap>=s) e=n; return e; }
function rangs(capT){ const base=[3,2,1,1], e=Math.max(0,(capT-5000)/3500);
  return base.map((b,i)=>{ const t=e-i; if(t<=0) return b; const k=Math.floor(t/4), r=t-4*k; return b+k+Math.min(1,r); }); }
function profondeurs(R){ const rows=rangs(R.cap-PLACES_VIRAGES*(R.virages||0)), vir=R.virages||0, u=Math.max(0,Math.min(1,(R.cap-20000)/35000))*vir;
  const moy=rows.reduce((a,b)=>a+b,0)/4; return rows.map(r=>Math.max(1,Math.round(r+(moy-r)*u))); }
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
// La palette : une vingtaine de couleurs, pas une de plus.
const C=Object.fromEntries(Object.entries({
  encre:'#05070f', nuit:'#080d1f', sol:'#111a36', parvis:'#1b2547', route:'#0c1228', marque:'#3d4877',
  herbe:'#1f6b3a', herbe2:'#2a8347', herbe3:'#49a85c', pierre:'#cdbf9f', or:'#b8901f', trait:'#dfe6f5', beton:'#454d75', beton2:'#5a6390', beton3:'#8a93bd', clair:'#c9cfe6',
  siege:'#2b56a8', siege2:'#3a6fc9', jaune:'#ffd24a', rouge:'#d8433a', blanc:'#f2f5fa', peau:'#e2b58f', arbre:'#1a4a33', arbre2:'#256b45', lueur:'#3a4370'
}).map(([k,v])=>[k,hex(v)]));
const hasard=(a,b)=>{ let t=(a*374761393+b*668265263)|0; t=(t^(t>>>13))*1274126177|0; return ((t^(t>>>16))>>>0)/4294967296; };
/* ---- AU FIL DES MOIS (v2.81) : la maquette vit avec le calendrier. R.mois (0 = janvier) et R.jour (la journée : le temps
   change d'une semaine à l'autre, mais pas d'une image à l'autre). Sans R.mois, c'est septembre. Les arbres verdissent,
   roussissent, perdent leurs feuilles et fleurissent ; la pelouse s'use d'août à mai et repart neuve l'été ; il pleut à
   l'automne, il neige certains hivers ; en décembre, un sapin s'allume. ---- */
const USURE_MOIS=[.7,.8,.85,.9,1,0,0,.05,.15,.3,.45,.6];
function saisonDe(R){ const m=R.mois==null?8:((R.mois%12)+12)%12, j=R.jour|0, h=hasard(j*7+m*31+5,m*13+3), h2=hasard(j*3+11,m*5+1);
  const hiver=m===11||m<=1, automne=m===9||m===10, printemps=m>=2&&m<=4, ete=m>=5&&m<=8;
  const neigeSol=(m===0||m===1)?h<.5:(m===11?h<.25:false), neige=neigeSol&&h2<.7;
  const pluie=!neigeSol&&((automne&&h<.55)||(m===2&&h<.4)||(hiver&&h<.35)||((m===3||m===4)&&h<.12));
  return {m,hiver,automne,printemps,ete,neigeSol,neige,pluie,usure:USURE_MOIS[m],nu:hiver,fleurs:m===3,feuilles:automne,sapin:m===11,resemis:m===5||m===6}; }
function paletteSaison(Sa){ const c=Object.assign({},C);
  if(Sa.automne){ c.arbre=hex('#7a4a24'); c.arbre2=hex('#c27a2c'); }
  if(Sa.printemps) c.arbre2=hex('#3f8f4f');
  if(Sa.hiver){ c.herbe=hex('#1b5a35'); c.herbe2=hex('#23683e'); }
  if(Sa.m===7||Sa.m===8) c.herbe2=hex('#33833f');
  c.feuille=hex('#c27a2c'); c.fleur=hex('#e9a3bd'); c.neigeC=hex('#e8eef8'); c.neigeO=hex('#c3cde0'); c.pluieC=hex('#7f9fc4'); c.usee=hex('#7d6b3e'); c.bois=c.bois||hex('#4b3a2a'); if(Sa.neigeSol){ c.clair=c.neigeC; }
  return c; }

function rendre(ctx, R, image, E, o){
  // E = la finesse : 1 donne la grille de base (320 x 224), 2 une grille deux fois plus fine (640 x 448). Le plan ne
  // bouge pas ; les petits sujets (public, arbres, projecteurs, drapeaux, voitures) sont redessinés, pas grossis.
  E=E||1; const GW=Math.round(320*E), GH=Math.round(224*E), S=n=>Math.max(1,Math.round(n*E));
  const Sa=saisonDe(R), C=paletteSaison(Sa);   // la palette du mois, pour cette image seulement
  // LE DIRECT (v2.82) : o.direct = {sc:[nous, eux], dom:[maillot, short], ext:[maillot, short], rouges:[nous, eux],
  // evt:{type:'but'|'rouge', cote:'dom'|'ext', t:images depuis l'action}}. Sans o.direct, rien ne change.
  const DIR=o&&o.direct?Object.assign({},o.direct,{dom:(o.direct.dom||['#ffd24a','#1f6b3a']).map(hex),ext:(o.direct.ext||['#f2f5fa','#2b56a8']).map(hex)}):null;
  const EVT=DIR&&DIR.evt||null, feteDir=EVT&&EVT.type==='but'&&EVT.t<14, sifflets=EVT&&EVT.type==='rouge'&&EVT.t<12;
  const buf=new Uint8ClampedArray(GW*GH*4);
  const px=(x,y,c)=>{ if(x<0||y<0||x>=GW||y>=GH) return; const i=(y*GW+x)*4; buf[i]=c[0]; buf[i+1]=c[1]; buf[i+2]=c[2]; buf[i+3]=255; };
  const lit=(x,y)=>{ const i=(y*GW+x)*4; return [buf[i],buf[i+1],buf[i+2]]; };
  const ligne=(a,b,c)=>{ let [x0,y0]=a,[x1,y1]=b; const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let e=dx+dy;
    for(;;){ px(x0,y0,c); if(x0===x1&&y0===y1) break; const e2=2*e; if(e2>=dy){ e+=dy; x0+=sx; } if(e2<=dx){ e+=dx; y0+=sy; } } };
  const poly=(P,c,bord)=>{ let y0=GH, y1=0; for(const p of P){ y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
    for(let y=Math.max(0,y0); y<=Math.min(GH-1,y1); y++){ const xs=[];
      for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length]; if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y)) xs.push(Math.round(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]))); }
      xs.sort((u,v)=>u-v); for(let i=0;i+1<xs.length;i+=2) for(let x=xs[i]; x<=xs[i+1]; x++) px(x,y,c); }
    if(bord) for(let i=0;i<P.length;i++) ligne(P[i],P[(i+1)%P.length],bord); };

  // --- géométrie : rangs par côté (Nord, Sud, Est, Ouest), comme la maquette d'origine
  const [nN,nS,nE,nO]=profondeurs(R), vir=R.virages?1:0, toit=R.toit?1:0, ecl=R.eclairage||1;
  const hN=nN*RZ, hS=nS*RZ, hE=nE*RZ, hO=nO*RZ, zMax=Math.max(hN,hS,hE,hO)+(toit?8:0)+(ecl===2?30:10);
  const G=1.4+Math.max(0,Math.min(1,(R.cap-5000)/95000))*.5;   // les annexes grossissent avec le stade, pour rester lisibles quand la vue recule
  const m=16+12*G, xa=-(nO*D+m), xb=L+nE*D+m, ya=-(nN*D+m), yb=W+nS*D+m;
  let k=Math.min(1.3*E, (GW-6*E)/((xb-ya)-(xa-yb)), (GH-26*E)/(((xb+yb)-(xa+ya))/2+zMax*1.05)), kz=k*1.05;
  let ox=GW/2-((xb-ya)+(xa-yb))/2*k, oy=(GH-14*E)/2-((xb+yb)+(xa+ya))/4*k+zMax*kz/2+2*E;
  // la carte de livraison : un cadre serré sur ce qui vient d'être livré ; les petits sujets suivent le zoom (redessinés, pas grossis)
  if(o&&o.focus){ const Xg=-nO*D, Xd=L+nE*D, Yb=W+nS*D, XM0=-4, hM=Math.max(hN,hS,hE,hO), dM=Math.max(nN,nS,nE,nO)*D;
    const F={hotel:[Xd+7,Xd+7+14*G,0,14*G,28*G], boutique:[Xd+7,Xd+7+17*G,W+8-18*G,W+8,16*G], musee:[XM0,XM0+22*G,Yb+8,Yb+8+13*G,10*G],
      restaurant:[XM0+24*G,XM0+42*G,Yb+8,Yb+8+12*G,14*G], buvette:[XM0+44*G,XM0+66*G,Yb+8,Yb+8+14*G,9*G],
      transport:o.niv===1?[Xg-30,Xg-6,4,W-4,4]:[Xg-30,Xd-20,Yb-20,yb+12,10], kop:[-dM-6,30,-dM-6,25,hM+12], pelouse:[6,L-6,-6,W+2,10]}[o.focus]||[Xg-3,Xd+3,-nN*D-3,Yb+3,hM+(toit?8:0)];
    const [x0,x1,y0,y1,zt]=F, zh=(zt||12)*1.05, k0=k;
    k=Math.min(GW*.8/((x1-y0)-(x0-y1)), GH*.72/(((x1+y1)-(x0+y0))/2+zh), 6*E); kz=k*1.05;
    ox=GW/2-((x1-y0)+(x0-y1))/2*k; oy=GH*.52-(((x0+y0)+(x1+y1))/4*k-zh*kz/2); E=E*k/k0; }
  let T=null;   // loupe posée sur une annexe : {x, y, g} grossit tout autour de son point d'ancrage
  const P=(x,y,z)=>{ z=z||0; if(T){ x=T.x+(x-T.x)*T.g; y=T.y+(y-T.y)*T.g; z*=T.g; } return [Math.round(ox+(x-y)*k), Math.round(oy+(x+y)*k/2-z*kz)]; };
  const quad=(pts,c,bord)=>poly(pts.map(p=>P(p[0],p[1],p[2])),c,bord);

  // --- de quoi bâtir le quartier : une boîte (dessus, face sud, face est), ses fenêtres, ses repères
  const X0=-nO*D, X1=L+nE*D, Y1=W+nS*D, XM=-4, niv=f=>Math.max(0,Math.min(3,Math.round(R[f]||0)));
  const boite=(x0,x1,y0,y1,z0,z1,cT,cF,cE)=>{ quad([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],cF,C.encre); quad([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],cE,C.encre); quad([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],cT,C.encre); };
  const vitres=(x0,x1,y0,y1,z0,z1,g,c)=>{ const ke=k*(T?T.g:1), pasX=Math.max(2.2/(T?T.g:1),1.9/ke), pasZ=Math.max(2.8/(T?T.g:1),2.2/ke);
    for(let z=z0+2;z<z1-1;z+=pasZ){ for(let x=x0+1.4;x<x1-.8;x+=pasX){ const q=P(x,y1,z); fen(q[0],q[1],hasard(Math.round(x*3)+g,Math.round(z*3))<.7?c:C.encre); }
      for(let y=y0+1.4;y<y1-.8;y+=pasX){ const q=P(x1,y,z); fen(q[0],q[1],hasard(Math.round(y*3)+g+5,Math.round(z*3))<.7?c:C.encre); } } };
  const point=(x,y,z,c)=>{ const q=P(x,y,z); px(q[0],q[1],c); };
  const est=(x,y,c)=>{ const v=lit(x,y); return v[0]===c[0]&&v[1]===c[1]&&v[2]===c[2]; };
  // --- au fil des mois : l'arbre nu de l'hiver, les feuilles mortes, le sapin de décembre, la pluie et la neige qui tombent
  const arbreNu=(p,g)=>{ const h=Math.round((g?6.5:5)*Math.max(1,E)); px(p[0],p[1],C.encre); for(let d=1;d<=h;d++) px(p[0],p[1]-d,C.bois);
    for(const [f,s] of [[.45,-1],[.62,1],[.78,-1],[.9,1]]){ const y0=p[1]-Math.round(h*f), l=Math.max(1,Math.round(h*.34*(1.15-f)));
      for(let i=1;i<=l;i++) px(p[0]+s*i,y0-Math.round(i*.7),C.bois); if(Sa.neigeSol) px(p[0]+s*l,y0-Math.round(l*.7)-1,C.neigeC); }
    if(Sa.neigeSol) px(p[0],p[1]-h-1,C.neigeC); };
  const feuillesMortes=p=>{ if(!Sa.feuilles) return; for(let i=0;i<5;i++) px(p[0]+Math.round((hasard(p[0]+i,p[1])-.5)*6*Math.max(1,E)),p[1]+Math.round(hasard(p[1]+i,p[0])*2*Math.max(1,E)),C.feuille); };
  const sapin=(x,y,deco)=>{ const p=P(x,y,0), e=Math.max(1,E), h=Math.round(8*e); px(p[0],p[1],C.bois);
    for(let d=1;d<=h;d++){ const w=Math.round((h-d)/h*2.6*e); for(let dx=-w;dx<=w;dx++){ const g=((dx*3+d*5+image)%7+7)%7===0;
      px(p[0]+dx,p[1]-d-1, g?deco[((dx+d)%deco.length+deco.length)%deco.length]:(dx<0?hex('#256b45'):hex('#1a4a33'))); } }
    for(let d=0;d<S(1.5);d++) px(p[0],p[1]-h-2-d,C.jaune); };
  const intemperies=()=>{ if(!Sa.neige&&!Sa.pluie) return; const n=Math.round((Sa.neige?150:110)*E*E/(E>1?1.4:1));
    for(let i=0;i<n;i++){ const bx=hasard(i,17)*GW, by=hasard(i,29)*GH;
      if(Sa.neige){ const y=Math.round(by+image*S(1.5))%GH, x=(Math.round(bx+Math.sin(image*.7+i)*S(1.5))+GW)%GW; for(let a=0;a<S(1);a++) for(let b=0;b<S(1);b++) px(x+a,y+b,C.neigeC); }
      else { const y=Math.round(by+image*S(7))%GH, x=(Math.round(bx-image*S(2))%GW+GW)%GW; for(let d=0;d<S(3);d++) px(x-Math.round(d*.35),y+d,C.pluieC); } } };
  // la neige au sol (et le givre sur l'herbe, sauf pelouse chauffante), ou les feuilles mortes : un saupoudrage, pixel par pixel
  const saupoudre=(sur,terr,dens)=>{ if(!Sa.neigeSol&&!Sa.feuilles) return; dens=dens==null?1:dens; if(!Sa.neigeSol&&dens<1) return;
    for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){ const h=hasard(x*7+3,y*11+Sa.m);
      if(Sa.neigeSol){ if((dens<1?(x+2*y)%5===0:true)&&sur.some(c=>est(x,y,c))) px(x,y,dens<1?C.neigeO:h<.84?C.neigeC:C.neigeO); else if(h<.03&&terr.some(c=>est(x,y,c))) px(x,y,C.neigeC); }
      else if(h<.012&&sur.some(c=>est(x,y,c))){ px(x,y,C.feuille); px(x+1,y,C.feuille); } } };
  // l'usure de la pelouse : devant les buts d'abord, puis au rond central, d'août à mai
