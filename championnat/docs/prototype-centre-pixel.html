<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiplex campus pixel art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1626; --panel:#10233f; --panel2:#0e1d35; --line:#27466e;
    --txt:#d9e4f2; --dim:#8fa6c4; --clair:#f2f5fa; --jaune:#ffd24a;
    --font-texte:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-ui:'VT323','Lucida Console',monospace; --font-led:'Silkscreen','VT323',monospace;
  }
  /* Le jeu vit la nuit : même palette en clair comme en sombre, volontairement. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1626; } }
  :root[data-theme="dark"]{ --bg:#0b1626; }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{ box-sizing:inherit; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--txt); font-family:var(--font-texte); font-size:15px; line-height:1.5; }
  .page{ max-width:980px; margin:0 auto; padding:18px 16px 50px; }
  .jeu{ font-family:var(--font-led); color:var(--jaune); font-size:12px; }
  h1{ font-family:var(--font-ui); font-weight:normal; font-size:38px; line-height:1; color:var(--clair); margin:4px 0 14px; }
  .cadre{ position:relative; border:4px solid #1b2c49; background:#070b1a; box-shadow:inset 0 0 0 2px #000, 0 0 0 2px #000, 4px 4px 0 2px rgba(0,0,0,.55); }
  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  .legende{ position:absolute; left:10px; right:10px; bottom:8px; display:flex; justify-content:space-between; gap:10px; font-family:var(--font-led); font-size:13px; pointer-events:none; }
  .legende b{ font-weight:normal; color:var(--jaune); text-shadow:0 0 2px currentColor,0 1px 0 rgba(0,0,0,.6); }
  .legende span{ color:var(--clair); text-shadow:0 1px 0 rgba(0,0,0,.6); }
  .pupitre{ margin-top:18px; background:var(--panel); border:2px solid var(--line); box-shadow:5px 5px 0 #040a14; padding:16px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 22px; }
  @media (max-width:640px){ .pupitre{ grid-template-columns:1fr; } h1{ font-size:32px; } }
  label.r{ display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-bottom:4px; }
  label.r output{ color:var(--txt); font-variant-numeric:tabular-nums; }
  input[type=range]{ width:100%; accent-color:var(--jaune); min-height:28px; }
  .seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; }
  .seg button{ font-family:inherit; font-size:12px; min-height:44px; padding:6px 4px; color:var(--dim); background:#1a3052; border:2px solid #000; box-shadow:inset 2px 2px 0 rgba(255,255,255,.1), inset -2px -2px 0 rgba(0,0,0,.45); cursor:pointer; }
  .seg button[aria-pressed="true"]{ background:#0c1830; border-color:var(--jaune); color:var(--jaune); box-shadow:inset 2px 2px 0 rgba(0,0,0,.6); }
  .seg button:disabled{ opacity:.45; cursor:not-allowed; }
  button:focus-visible,input:focus-visible,select:focus-visible{ outline:2px solid var(--jaune); outline-offset:2px; }
  .titre{ font-size:13px; color:var(--dim); margin-bottom:5px; }
  select{ width:100%; min-height:44px; font:inherit; font-size:13px; color:var(--txt); background:#1a3052; border:2px solid #000; padding:0 8px; }
  .bas{ grid-column:1 / -1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 22px; border-top:2px solid var(--line); padding-top:14px; }
  @media (max-width:640px){ .bas{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page">
  <div class="jeu">MULTIPLEX · PROTOTYPE</div>
  <h1>Le campus en vrai pixel art</h1>
  <div class="cadre">
    <canvas id="ecran" width="320" height="224" role="img" aria-label="Maquette du centre d'entraînement en pixel art"></canvas>
    <div class="legende"><b id="palier"></b><span id="saison"></span></div>
  </div>
  <div class="pupitre" id="pupitre">
    <div class="bas">
      <div><label class="r" for="rMois">Mois <output id="moisOut"></output></label><input type="range" id="rMois" min="0" max="11" step="1" value="8"></div><div><div class="titre">Le temps qu'il fait</div><div class="seg"><button type="button" id="bSem">Une autre semaine</button></div></div>
      <div style="grid-column:1 / -1"><div class="titre">Finesse du dessin</div><div class="seg" id="segFin"><button type="button" data-e="1" aria-pressed="true">320 · comme le stade</button><button type="button" data-e="1.5" aria-pressed="false">480</button><button type="button" data-e="2" aria-pressed="false">640</button></div></div>
      <div><label class="r" for="rAn">Saison <output id="anOut"></output></label><input type="range" id="rAn" min="1990" max="2010" step="1" value="1996"></div>
      <div><div class="titre">Chantier en cours</div><select id="sCh"></select></div>
      <div><div class="titre">Raccourcis</div><div class="seg"><button type="button" id="bZero">Tout à zéro</button><button type="button" id="bMax">Tout au max</button></div></div>
    </div>
  </div>
</div>
<script>
/* ============================================================
   CAMPUSPIX : LE CENTRE D'ENTRAÎNEMENT EN VRAI PIXEL ART
   Même moteur que STADEPIX : chaque pixel est posé exprès sur une grille de 320 x 224, palette fermée, contours à
   l'encre, aucun filtre. Même plan que la maquette d'origine (campus de 240 m sur 200, quatre terrains, six familles
   de bâtiments à trois niveaux, et le château). R = {terrains, physique, medical, vie, academie, video : 0 à 3,
   chateau : 0/1, annee, chantier : null | {id, n}}. image = compteur, quatre images par seconde.
   ============================================================ */
const CAMPUSPIX=(()=>{
const CS=0.8660254;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
// La palette : celle du stade, plus les matériaux du campus. Une trentaine de couleurs, pas une de plus.
const C=Object.fromEntries(Object.entries({
  encre:'#05070f', nuit:'#080d1f', gazon:'#10241c', gazon2:'#15301f', route:'#1a2b3f', marque:'#3d4877',
  herbe:'#1f6b3a', herbe2:'#2a8347', herbe3:'#49a85c', friche:'#18301f', terre:'#5a4330', terre2:'#7d6b3e', stab:'#8a6a45',
  trait:'#dfe6f5', beton:'#454d75', beton2:'#5a6390', beton3:'#8a93bd', clair:'#c9cfe6',
  brique:'#8a5a44', brique2:'#6b4535', tuile:'#a3593f', verre:'#7fa3c4', verre2:'#35658f',
  pierre:'#cdbf9f', pierre2:'#a3977f', ardoise:'#2f3d54', ardoise2:'#232e41', eau:'#3f8fcf', eau2:'#244e74',
  chantier:'#d98a3a', chantier2:'#a5622b', jaune:'#ffd24a', rouge:'#d8433a', blanc:'#f2f5fa', peau:'#e2b58f',
  bleu:'#3a6fc9', arbre:'#1a4a33', arbre2:'#256b45', bois:'#4b3a2a', lueur:'#3a4370'
}).map(([k,v])=>[k,hex(v)]));
const hasard=(a,b)=>{ let t=(a*374761393+b*668265263)|0; t=(t^(t>>>13))*1274126177|0; return ((t^(t>>>16))>>>0)/4294967296; };
// Les matériaux : [toit, face avant, face est]
const MAT={
  prefab:[C.beton3,C.beton2,C.beton], brique:[C.tuile,C.brique,C.brique2], clair:[C.clair,C.beton3,C.beton2],
  beton:[C.beton3,C.beton2,C.beton], tole:[C.beton2,C.beton,C.lueur], verre:[C.verre,C.verre2,C.eau2],
  pierre:[C.pierre,C.pierre,C.pierre2], chantier:[C.chantier,C.chantier,C.chantier2]
};
// Le cadrage : le campus fait 240 m sur 200, on garde une marge pour la route et les arbres.
/* ---- AU FIL DES MOIS (v2.81) : la maquette vit avec le calendrier. R.mois (0 = janvier) et R.jour (la journée : le temps
   change d'une semaine à l'autre, mais pas d'une image à l'autre). Sans R.mois, c'est septembre. Les arbres verdissent,
   roussissent, perdent leurs feuilles et fleurissent ; la pelouse s'use d'août à mai et repart neuve l'été ; il pleut à
   l'automne, il neige certains hivers ; en décembre, un sapin s'allume. ---- */
const USURE_MOIS=[.7,.8,.85,.9,1,0,0,.05,.15,.3,.45,.6];
function saisonDe(R){ const m=R.mois==null?8:((R.mois%12)+12)%12, j=R.jour|0, h=hasard(j*7+m*31+5,m*13+3), h2=hasard(j*3+11,m*5+1);
  const hiver=m===11||m<=1, automne=m===9||m===10, printemps=m>=2&&m<=4, ete=m>=5&&m<=8;
  const neigeSol=(m===0||m===1)?h<.5:(m===11?h<.25:false), neige=neigeSol&&h2<.7;
  const pluie=!neigeSol&&((automne&&h<.55)||(m===2&&h<.4)||(hiver&&h<.35)||((m===3||m===4)&&h<.12));
  return {m,hiver,automne,printemps,ete,neigeSol,neige,pluie,usure:USURE_MOIS[m],nu:hiver,fleurs:m===3,feuilles:automne,sapin:m===11,resemis:m===5||m===6}; }
function paletteSaison(Sa){ const c=Object.assign({},C);
  if(Sa.automne){ c.arbre=hex('#7a4a24'); c.arbre2=hex('#c27a2c'); }
  if(Sa.printemps) c.arbre2=hex('#3f8f4f');
  if(Sa.hiver){ c.herbe=hex('#1b5a35'); c.herbe2=hex('#23683e'); }
  if(Sa.m===7||Sa.m===8) c.herbe2=hex('#33833f');
  c.feuille=hex('#c27a2c'); c.fleur=hex('#e9a3bd'); c.neigeC=hex('#e8eef8'); c.neigeO=hex('#c3cde0'); c.pluieC=hex('#7f9fc4'); c.usee=hex('#7d6b3e');
  return c; }
// E = la finesse de la grille : 1 donne 320 x 224 (celle du stade), 2 donne 640 x 448. Le plan et les règles ne
// bougent pas ; à finesse double, on voit deux fois plus de pixels sur le même campus, et les petits sujets
// (joueurs, arbres, fanions, projecteurs) sont redessinés avec plus de détails au lieu d'être simplement grossis.
const XA=-14, XB=254, YA=-18, YB=214, ZM=50;
const T=[[60,60,135,120],[150,60,225,120],[60,132,135,192],[150,132,225,192]];
function cadre(E){ const GW=Math.round(320*E), GH=Math.round(224*E);
  const k=Math.min((GW-8*E)/(((XB-YA)-(XA-YB))*CS), (GH-8*E)/(((XB+YB)-(XA+YA))*.5+ZM*1.1)), kz=k*1.1;
  const ox=Math.round(GW/2-((XB-YA)+(XA-YB))/2*CS*k), oy=Math.round(4*E+ZM*kz-(XA+YA)*.5*k);
  return {GW,GH,k,kz,P:(x,y,z)=>[Math.round(ox+(x-y)*CS*k), Math.round(oy+(x+y)*.5*k-(z||0)*kz)]}; }

// la carte de livraison : un cadre serré sur ce qui vient d'être livré, f = [x0, x1, y0, y1, hauteur] en mètres
function cadreSur(E,f){ const {GW,GH}=cadre(E), [x0,x1,y0,y1,zt]=f, zh=(zt||12)*1.1;
  const k=Math.min(GW*.8/(((x1-y0)-(x0-y1))*CS), GH*.74/(((x1+y1)-(x0+y0))*.5+zh), 7*E), kz=k*1.1;
  const ox=Math.round(GW/2-((x1-y0)+(x0-y1))/2*CS*k), oy=Math.round(GH*.52-(((x0+y0)+(x1+y1))*.25*k-zh*kz*.5));
  return {k,kz,P:(x,y,z)=>[Math.round(ox+(x-y)*CS*k), Math.round(oy+(x+y)*.5*k-(z||0)*kz)]}; }
// ce que chaque livraison montre : la famille, et pour les terrains le niveau
function zoneLivraison(id,n){
  if(id==='terrains') return n===1?[150,225,60,120,6]:n===2?[60,225,132,192,24]:[140,232,120,200,22];
  return {vie:[50,100,10,50,24], medical:[104,140,8,52,15], physique:[144,196,10,42,18], video:[196,236,10,58,46],
    academie:n===3?[10,58,56,192,16]:[10,48,56,110,15], chateau:[2,60,114,200,42]}[id]||null; }

function peindre(R, image, E, o){
  E=E||1; o=o||{}; const base=cadre(E), {GW,GH}=base; let {k,kz,P}=base;
  if(o.focus){ const z=cadreSur(E,o.focus); E=E*z.k/k; k=z.k; kz=z.kz; P=z.P; }   // les petits sujets suivent le zoom : redessinés, pas grossis
  const S=n=>Math.max(1,Math.round(n*E));
  const Sa=saisonDe(R), C=paletteSaison(Sa);   // la palette du mois, pour cette image seulement
  const buf=new Uint8ClampedArray(GW*GH*4);
  const px=(x,y,c)=>{ if(x<0||y<0||x>=GW||y>=GH) return; const i=(y*GW+x)*4; buf[i]=c[0]; buf[i+1]=c[1]; buf[i+2]=c[2]; buf[i+3]=255; };
  const est=(x,y,c)=>{ if(x<0||y<0||x>=GW||y>=GH) return false; const i=(y*GW+x)*4; return buf[i]===c[0]&&buf[i+1]===c[1]&&buf[i+2]===c[2]; };
  const ligne=(a,b,c,pointille)=>{ let [x0,y0]=a,[x1,y1]=b; const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let e=dx+dy, n=0;
    for(;;){ if(!pointille||(n++%pointille)===0) px(x0,y0,c); if(x0===x1&&y0===y1) break; const e2=2*e; if(e2>=dy){ e+=dy; x0+=sx; } if(e2<=dx){ e+=dx; y0+=sy; } } };
  const poly=(Q,c,bord)=>{ let y0=GH, y1=0; for(const p of Q){ y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
    for(let y=Math.max(0,y0); y<=Math.min(GH-1,y1); y++){ const xs=[];
      for(let i=0;i<Q.length;i++){ const a=Q[i], b=Q[(i+1)%Q.length]; if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y)) xs.push(Math.round(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]))); }
      xs.sort((u,v)=>u-v); for(let i=0;i+1<xs.length;i+=2) for(let x=xs[i]; x<=xs[i+1]; x++) px(x,y,c); }
    if(bord) for(let i=0;i<Q.length;i++) ligne(Q[i],Q[(i+1)%Q.length],bord); };
  const quad=(Q,c,bord)=>poly(Q.map(q=>P(...q)),c,bord);
  const sol=(x0,x1,y0,y1,c,bord,z)=>quad([[x0,y0,z||0],[x1,y0,z||0],[x1,y1,z||0],[x0,y1,z||0]],c,bord);
  const seg3=(a,b,c,p)=>ligne(P(...a),P(...b),c,p);
  const pt=(x,y,z,c)=>{ const q=P(x,y,z); px(q[0],q[1],c); };
  // --- au fil des mois : l'arbre nu de l'hiver, les feuilles mortes, le sapin de décembre, la pluie et la neige qui tombent
  const arbreNu=(p,g)=>{ const h=Math.round((g?6.5:5)*Math.max(1,E)); px(p[0],p[1],C.encre); for(let d=1;d<=h;d++) px(p[0],p[1]-d,C.bois);
    for(const [f,s] of [[.45,-1],[.62,1],[.78,-1],[.9,1]]){ const y0=p[1]-Math.round(h*f), l=Math.max(1,Math.round(h*.34*(1.15-f)));
      for(let i=1;i<=l;i++) px(p[0]+s*i,y0-Math.round(i*.7),C.bois); if(Sa.neigeSol) px(p[0]+s*l,y0-Math.round(l*.7)-1,C.neigeC); }
    if(Sa.neigeSol) px(p[0],p[1]-h-1,C.neigeC); };
  const feuillesMortes=p=>{ if(!Sa.feuilles) return; for(let i=0;i<5;i++) px(p[0]+Math.round((hasard(p[0]+i,p[1])-.5)*6*Math.max(1,E)),p[1]+Math.round(hasard(p[1]+i,p[0])*2*Math.max(1,E)),C.feuille); };
  const sapin=(x,y,deco)=>{ const p=P(x,y,0), e=Math.max(1,E), h=Math.round(8*e); px(p[0],p[1],C.bois);
    for(let d=1;d<=h;d++){ const w=Math.round((h-d)/h*2.6*e); for(let dx=-w;dx<=w;dx++){ const g=((dx*3+d*5+image)%7+7)%7===0;
      px(p[0]+dx,p[1]-d-1, g?deco[((dx+d)%deco.length+deco.length)%deco.length]:(dx<0?hex('#256b45'):hex('#1a4a33'))); } }
    for(let d=0;d<S(1.5);d++) px(p[0],p[1]-h-2-d,C.jaune); };
  const intemperies=()=>{ if(!Sa.neige&&!Sa.pluie) return; const n=Math.round((Sa.neige?150:110)*E*E/(E>1?1.4:1));
    for(let i=0;i<n;i++){ const bx=hasard(i,17)*GW, by=hasard(i,29)*GH;
      if(Sa.neige){ const y=Math.round(by+image*S(1.5))%GH, x=(Math.round(bx+Math.sin(image*.7+i)*S(1.5))+GW)%GW; for(let a=0;a<S(1);a++) for(let b=0;b<S(1);b++) px(x+a,y+b,C.neigeC); }
      else { const y=Math.round(by+image*S(7))%GH, x=(Math.round(bx-image*S(2))%GW+GW)%GW; for(let d=0;d<S(3);d++) px(x-Math.round(d*.35),y+d,C.pluieC); } } };
  // la neige au sol (et le givre sur l'herbe, sauf pelouse chauffante), ou les feuilles mortes : un saupoudrage, pixel par pixel
  const saupoudre=(sur,terr,dens)=>{ if(!Sa.neigeSol&&!Sa.feuilles) return; dens=dens==null?1:dens; if(!Sa.neigeSol&&dens<1) return;
    for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){ const h=hasard(x*7+3,y*11+Sa.m);
      if(Sa.neigeSol){ if((dens<1?(x+2*y)%5===0:true)&&sur.some(c=>est(x,y,c))) px(x,y,dens<1?C.neigeO:h<.84?C.neigeC:h<.97?C.neigeO:C.gazon2); else if(h<.03&&terr.some(c=>est(x,y,c))) px(x,y,C.neigeC); }
      else if(h<.012&&sur.some(c=>est(x,y,c))){ px(x,y,C.feuille); px(x+1,y,C.feuille); } } };
  // l'usure de la pelouse : devant les buts d'abord, puis au rond central, d'août à mai
  const usure=(cx,cy,rx,ry,d)=>{ for(let a=-rx;a<=rx;a+=.6) for(let b=-ry;b<=ry;b+=.6) if((a*a)/(rx*rx)+(b*b)/(ry*ry)<1&&hasard(Math.round((cx+a)*5),Math.round((cy+b)*5))<d){ const q=P(cx+a,cy+b,0); px(q[0],q[1],C.usee); } };

  // --- la scène se peint en deux temps : le sol d'abord, puis tout ce qui dépasse, trié de l'arrière vers l'avant
  const objets=[]; const add=(cle,fn)=>objets.push([cle,fn]);
  let CH=false; const mat=m=>CH?MAT.chantier:MAT[m];
  const boite=(x0,x1,y0,y1,z0,z1,m)=>{ const c=mat(m);
    quad([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c[1],C.encre);
    quad([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],c[2],C.encre);
    const dessus=Sa.neigeSol&&!CH?C.neigeC:c[0];
    quad([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],dessus,C.encre);
    // à grille fine, le toit-terrasse a son acrotère et ses édicules
    if(E>=1.5&&!CH&&x1-x0>8&&y1-y0>8){ const m=1.2; quad([[x0+m,y0+m,z1],[x1-m,y0+m,z1],[x1-m,y1-m,z1],[x0+m,y1-m,z1]],dessus,c[2]);
      const ex=x0+(x1-x0)*.3, ey=y0+(y1-y0)*.35; quad([[ex,ey+3,z1],[ex+4,ey+3,z1],[ex+4,ey+3,z1+1.4],[ex,ey+3,z1+1.4]],c[1],C.encre); quad([[ex+4,ey,z1],[ex+4,ey+3,z1],[ex+4,ey+3,z1+1.4],[ex+4,ey,z1+1.4]],c[2],C.encre); quad([[ex,ey,z1+1.4],[ex+4,ey,z1+1.4],[ex+4,ey+3,z1+1.4],[ex,ey+3,z1+1.4]],c[0],C.encre); }
    if(CH){ for(let x=x0+3;x<x1-1;x+=4) seg3([x,y1,z0],[x,y1,z1],C.chantier2); for(let y=y0+3;y<y1-1;y+=4) seg3([x1,y,z0],[x1,y,z1],C.chantier2); } };
  // les fenêtres : un pixel par vitre, allumée ou noire, sur la façade avant et la façade est
  // une vitre = un pixel ; à grille fine, deux pixels de haut et un appui sous la vitre

  sel.innerHTML='<option value="">Aucun</option>'+FAMS.filter(f=>R[f.id]>=1).map(f=>`<option value="${f.id}">${f.nom} · ${f.court[R[f.id]]}</option>`).join('')+(R.chateau?'<option value="chateau">Le château</option>':'');
  if(R.chantier&&(R.chantier.id==='chateau'?R.chateau:R[R.chantier.id]>=1)){ sel.value=v; R.chantier.n=R.chantier.id==='chateau'?1:R[R.chantier.id]; } else { R.chantier=null; sel.value=''; }
  $('moisOut').textContent=MOIS[R.mois];
  $('palier').textContent=palier(R); $('saison').textContent=R.chantier?'Chantier en cours':'';
  peins();
}
construirePupitre(); maj();
const REDUIT=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!REDUIT) setInterval(()=>{ image++; peins(); },250);
</script>
